<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DO NOT DISTURB</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
      overflow: hidden;
      text-align: center;
      background-color: #000;
      color: #fff;
    }

    /* WARNING SCREEN */
    #warning {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      background: #000;
    }

    #warning h1 {
      font-size: clamp(1.8rem, 6vw, 3.5rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.3;
      max-width: 90%;
    }

    #countdown {
      font-size: clamp(5rem, 20vw, 12rem);
      font-weight: 900;
      margin-top: 1.5rem;
      color: #ff2222;
      text-shadow: 0 0 30px rgba(255, 0, 0, 0.7);
    }

    #skipBtn {
      margin-top: 2.5rem;
      padding: 0.9rem 2.8rem;
      font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
      font-size: clamp(1.1rem, 3.5vw, 1.6rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: #ffd700;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    #skipBtn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
    }

    #skipBtn:active {
      transform: scale(0.97);
    }

    /* MAIN SCREEN */
    #main {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
      animation: screenFlash 0.15s steps(1) infinite;
    }

    #main a {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .logo {
      width: clamp(70px, 16vw, 140px);
      height: clamp(70px, 16vw, 140px);
    }

    /* Force Spotify logo to stay black */
    .logo path {
      fill: #000 !important;
    }

    .main-text {
      font-size: clamp(2.5rem, 11vw, 7rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      user-select: none;
    }

    .sub-text {
      font-size: clamp(0.9rem, 3.5vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    @keyframes screenFlash {
      0%, 49% {
        background-color: #000;
        color: #fff;
      }
      50%, 100% {
        background-color: #fff;
        color: #000;
      }
    }
  </style>
</head>
<body>
  <!-- WARNING / COUNTDOWN SCREEN -->
  <div id="warning">
    <h1>WARNING<br>FLASHING LIGHTS<br>TRANSPORTING TO SITE IN</h1>
    <div id="countdown">5</div>
    <button id="skipBtn">SKIP</button>
  </div>

  <!-- MAIN CONTENT -->
  <div id="main">
    <a href="https://open.spotify.com/artist/5EpZeaMfZBJDmydGL0Rs6m?si=ce886e1798db4356" target="_blank" rel="noopener">
      <!-- Official Spotify logo (forced black) -->
      <svg class="logo" viewBox="0 0 168 168" xmlns="http://www.w3.org/2000/svg">
        <path fill="#000" d="m83.996 0.277c-46.249 0-83.743 37.493-83.743 83.742 0 46.251 37.494 83.741 83.743 83.741 46.254 0 83.744-37.49 83.744-83.741 0-46.246-37.49-83.738-83.745-83.738l0.001-0.004zm38.404 120.78c-1.5 2.46-4.72 3.24-7.18 1.73-19.662-12.01-44.414-14.73-73.564-8.07-2.809 0.64-5.609-1.12-6.249-3.93-0.643-2.81 1.11-5.61 3.926-6.25 31.9-7.291 59.263-4.15 81.337 9.34 2.46 1.51 3.24 4.72 1.73 7.18zm10.25-22.805c-1.89 3.075-5.91 4.045-8.98 2.155-22.51-13.839-56.823-17.846-83.448-9.764-3.453 1.043-7.1-0.903-8.148-4.35-1.04-3.453 0.907-7.093 4.354-8.143 30.413-9.228 68.222-4.758 94.072 11.127 3.07 1.89 4.04 5.91 2.15 8.976v-0.001zm0.88-23.744c-26.99-16.031-71.52-17.505-97.289-9.684-4.138 1.255-8.514-1.081-9.768-5.219-1.254-4.14 1.08-8.513 5.221-9.771 29.581-8.98 78.756-7.245 109.83 11.202 3.73 2.209 4.95 7.016 2.74 10.733-2.2 3.722-7.02 4.949-10.73 2.739z"/>
      </svg>

      <div class="main-text">DO NOT DISTURB</div>
      <div class="sub-text">soon on streaming platforms</div>
    </a>
  </div>

  <script>
    let count = 5;
    const countdownEl = document.getElementById('countdown');
    const warningEl = document.getElementById('warning');
    const mainEl = document.getElementById('main');
    const skipBtn = document.getElementById('skipBtn');

    function goToMain() {
      clearInterval(timer);
      warningEl.style.display = 'none';
      mainEl.style.display = 'flex';
    }

    const timer = setInterval(() => {
      count--;
      if (count > 0) {
        countdownEl.textContent = count;
      } else {
        goToMain();
      }
    }, 1000);

    skipBtn.addEventListener('click', goToMain);
  </script>
</body>
</html>
