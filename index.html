<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  overflow: hidden;
  color: white;
  background: #000;
}

/* background */
.bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: -2;
}
body::before {
  content: "";
  position: fixed;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.55);
  z-index: -1;
}

/* profile card */
.card {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 320px;
  padding: 20px;
  text-align: center;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border-radius: 15px;
}
.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
}
.icons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 15px;
}
.icons img {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  transition: 0.2s;
}
.icons img:hover { transform: scale(1.2); }

/* last updated */
#lastUpdated {
  position: fixed;
  bottom: 10px;
  right: 15px;
  font-size: 12px;
  opacity: 0.75;
  text-shadow: 0 0 6px rgba(255,255,255,0.5);
  z-index: 10;
}

/* === MUSIC PLAYER (like your screenshot) === */
#musicPlayer {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: 92%;
  max-width: 480px;
  background: rgba(15, 15, 25, 0.95);
  backdrop-filter: blur(12px);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.7);
  z-index: 100;
}

#musicPlayer img {
  width: 48px;
  height: 48px;
  border-radius: 6px;
  object-fit: cover;
}

.track-info {
  flex: 1;
  min-width: 0;
}

#title {
  font-size: 14.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#artist {
  font-size: 12.5px;
  opacity: 0.75;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.progress-container {
  height: 3px;
  background: rgba(255,255,255,0.25);
  border-radius: 3px;
  margin-top: 6px;
  cursor: pointer;
}

.progress {
  height: 100%;
  background: #ff4d94;
  border-radius: 3px;
  width: 0%;
}

.controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.controls button {
  background: none;
  border: none;
  color: white;
  font-size: 1.45rem;
  cursor: pointer;
  padding: 4px;
}

#playBtn {
  font-size: 1.75rem;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>
