<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitterglue</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #000;
      --fg: #fff;
      --btn-bg: #fff;
      --btn-fg: #000;
    }

    body.light {
      --bg: #fff;
      --fg: #000;
      --btn-bg: #000;
      --btn-fg: #fff;
    }

    body {
      height: 100vh;
      font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      transition: background 0.25s, color 0.25s;
    }

    /* ========== HOME ========== */
    #home {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
      background: var(--bg);
      color: var(--fg);
    }

    .home-title {
      font-size: clamp(3rem, 14vw, 9rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      user-select: none;
    }

    .nav-btn {
      margin-top: 2.5rem;
      padding: 1rem 2.8rem;
      font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
      font-size: clamp(1.1rem, 3.5vw, 1.6rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: var(--btn-bg);
      color: var(--btn-fg);
      border: 3px solid var(--btn-bg);
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, color 0.15s, border-color 0.15s;
    }

    .nav-btn:hover {
      transform: scale(1.06);
      background: var(--bg);
      color: var(--fg);
      border-color: var(--fg);
    }

    /* ========== NEXT ALBUM (flashing) ========== */
    #album {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
      position: relative;
    }

    #album.flashing {
      animation: screenFlash 0.15s steps(1) infinite;
    }

    body.light #album.flashing {
      animation: screenFlashLight 0.15s steps(1) infinite;
    }

    #album a.main-link {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .logo {
      width: clamp(70px, 16vw, 140px);
      height: clamp(70px, 16vw, 140px);
    }

    .logo path {
      fill: #000;
    }

    body.light .logo path {
      fill: #fff;
    }

    .main-text {
      font-size: clamp(2.5rem, 11vw, 7rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      user-select: none;
    }

    .sub-text {
      font-size: clamp(0.9rem, 3.5vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .album-btn {
      margin-top: 2.5rem;
      padding: 0.9rem 2.4rem;
      font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
      font-size: clamp(1rem, 3vw, 1.4rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: transparent;
      color: inherit;
      border: 3px solid currentColor;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, color 0.15s;
    }

    .album-btn:hover {
      transform: scale(1.06);
      background: currentColor;
      color: var(--bg);
    }

    .album-btn.playing {
      background: currentColor;
      color: var(--bg);
    }

    /* Theme toggle top-right */
    #themeToggle {
      position: fixed;
      top: 1.2rem;
      right: 1.2rem;
      width: 48px;
      height: 48px;
      background: transparent;
      border: 2px solid var(--fg);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: var(--fg);
      transition: transform 0.2s, border-color 0.2s, color 0.2s;
    }

    #themeToggle:hover {
      transform: scale(1.12);
    }

    #themeToggle svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
    }

    #themeToggle .moon { display: none; }
    body.light #themeToggle .sun { display: none; }
    body.light #themeToggle .moon { display: block; }

    @keyframes screenFlash {
      0%, 49% {
        background-color: #000;
        color: #fff;
      }
      50%, 100% {
        background-color: #fff;
        color: #000;
      }
    }

    @keyframes screenFlashLight {
      0%, 49% {
        background-color: #fff;
        color: #000;
      }
      50%, 100% {
        background-color: #000;
        color: #fff;
      }
    }
  </style>
</head>
<body>
  <!-- Theme toggle (always visible) -->
  <button id="themeToggle" title="Toggle light / dark" aria-label="Toggle theme">
    <svg class="sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" fill="none"/>
    </svg>
    <svg class="moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor" stroke="none"/>
    </svg>
  </button>

  <!-- HOME PAGE -->
  <div id="home">
    <div class="home-title">Glitterglue</div>
    <button class="nav-btn" id="nextAlbumBtn">next album</button>
  </div>

  <!-- NEXT ALBUM / FLASHING PAGE -->
  <div id="album" class="flashing">
    <a class="main-link" href="https://open.spotify.com/artist/5EpZeaMfZBJDmydGL0Rs6m?si=ce886e1798db4356" target="_blank" rel="noopener">
      <svg class="logo" viewBox="0 0 168 168" xmlns="http://www.w3.org/2000/svg">
        <path d="m83.996 0.277c-46.249 0-83.743 37.493-83.743 83.742 0 46.251 37.494 83.741 83.743 83.741 46.254 0 83.744-37.49 83.744-83.741 0-46.246-37.49-83.738-83.745-83.738l0.001-0.004zm38.404 120.78c-1.5 2.46-4.72 3.24-7.18 1.73-19.662-12.01-44.414-14.73-73.564-8.07-2.809 0.64-5.609-1.12-6.249-3.93-0.643-2.81 1.11-5.61 3.926-6.25 31.9-7.291 59.263-4.15 81.337 9.34 2.46 1.51 3.24 4.72 1.73 7.18zm10.25-22.805c-1.89 3.075-5.91 4.045-8.98 2.155-22.51-13.839-56.823-17.846-83.448-9.764-3.453 1.043-7.1-0.903-8.148-4.35-1.04-3.453 0.907-7.093 4.354-8.143 30.413-9.228 68.222-4.758 94.072 11.127 3.07 1.89 4.04 5.91 2.15 8.976v-0.001zm0.88-23.744c-26.99-16.031-71.52-17.505-97.289-9.684-4.138 1.255-8.514-1.081-9.768-5.219-1.254-4.14 1.08-8.513 5.221-9.771 29.581-8.98 78.756-7.245 109.83 11.202 3.73 2.209 4.95 7.016 2.74 10.733-2.2 3.722-7.02 4.949-10.73 2.739z"/>
      </svg>
      <div class="main-text">DO NOT DISTURB</div>
      <div class="sub-text">soon on streaming platforms</div>
    </a>
    <button class="album-btn" id="sneakPeakBtn">sneak peak</button>
  </div>

  <!-- Hidden audio for sneak peak -->
  <audio id="sneakAudio" src="https://kappa.lol/viSrnU" preload="none"></audio>

  <script>
    const home = document.getElementById('home');
    const album = document.getElementById('album');
    const nextAlbumBtn = document.getElementById('nextAlbumBtn');
    const sneakPeakBtn = document.getElementById('sneakPeakBtn');
    const themeToggle = document.getElementById('themeToggle');
    const sneakAudio = document.getElementById('sneakAudio');

    nextAlbumBtn.addEventListener('click', () => {
      home.style.display = 'none';
      album.style.display = 'flex';
    });

    // Sneak peak: play / pause the track
    sneakPeakBtn.addEventListener('click', () => {
      if (sneakAudio.paused) {
        sneakAudio.play();
        sneakPeakBtn.textContent = 'playing...';
        sneakPeakBtn.classList.add('playing');
      } else {
        sneakAudio.pause();
        sneakPeakBtn.textContent = 'sneak peak';
        sneakPeakBtn.classList.remove('playing');
      }
    });

    sneakAudio.addEventListener('ended', () => {
      sneakPeakBtn.textContent = 'sneak peak';
      sneakPeakBtn.classList.remove('playing');
    });

    // Light / Dark mode toggle
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light');
    });
  </script>
</body>
</html>
