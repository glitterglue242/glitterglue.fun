<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link in Bio</title>
    <!-- CSS is kept inside the <style> tags below -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #080808; /* Deep dark background */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            overflow: hidden;
        }

        /* Glassmorphism Container */
        .card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .pfp { 
            width: 100px; height: 100px; border-radius: 50%; 
            margin-bottom: 20px; border: 2px solid rgba(255,255,255,0.1);
            object-fit: cover;
        }

        .pronouns { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.4; display: block; margin-bottom: 8px; }
        
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }

        /* Typewriter Effect Container */
        .bio-container { height: 20px; margin-bottom: 10px; }
        #typewriter {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #ccc;
        }

        .location { font-size: 13px; opacity: 0.5; margin-bottom: 30px; display: block; }

        /* Buttons */
        .links-wrapper { display: flex; flex-direction: column; gap: 12px; }
        .link {
            display: block; width: 100%; padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: white; text-decoration: none; border-radius: 12px;
            font-size: 14px; font-weight: 500; transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .link:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://discordapp.com" class="pfp" alt="Avatar">
        
        <span class="pronouns">he/him</span>
        <h1>@drums</h1>
        
        <div class="bio-container">
            <span id="typewriter"></span>
        </div>
        
        <span class="location">Studying at Leeds Conservatory</span>
        
        <div class="links-wrapper">
            <a href="https://www.roblox.com/users/685179066/profile" target="_blank" class="link">Roblox</a>
            <a href="https://www.youtube.com/@glittersdeathK" target="_blank" class="link">YouTube</a>
            <a href="https://open.spotify.com/artist/5M45ri6PzJk2DOdXEEbfnl?si=GN5BYmPVRBuPpkjZ_Yn6mA" target="_blank" class="link">Spotify</a>
        </div>
    </div>

    <!-- JS is kept inside the <script> tags below -->
    <script>
        const text = "drums are my honest passion";
        let index = 0;
        const speed = 100; // Typing speed in ms

        function typeWriter() {
            if (index < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            }
        }

        // Start typing when the page loads
        window.onload = typeWriter;
    </script>

</body>
</html>
