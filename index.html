<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">...</title>
    <!-- Icons Library -->
    <script src="https://unpkg.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #080808; 
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            color: white; overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .pfp { 
            width: 90px; height: 90px; border-radius: 50%; 
            margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1);
            object-fit: cover;
        }

        .pronouns { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.4; display: block; margin-bottom: 5px; }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }

        .bio-container { height: 18px; margin-bottom: 5px; }
        #typewriter { font-family: monospace; font-size: 13px; color: #aaa; }

        .location { font-size: 12px; opacity: 0.4; margin-bottom: 25px; display: block; }

        /* Minimal Music Player Styling */
        .player-container {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px;
            display: flex; align-items: center;
            text-align: left; margin-bottom: 25px;
            position: relative;
        }

        .album-art { width: 50px; height: 50px; border-radius: 8px; margin-right: 15px; background: #222; }
        
        .track-info { flex-grow: 1; overflow: hidden; }
        .track-status { font-size: 10px; text-transform: uppercase; opacity: 0.5; display: flex; align-items: center; gap: 5px; }
        .track-status::before { content: ""; width: 6px; height: 6px; background: #1db954; border-radius: 50%; display: inline-block; }
        
        .track-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .track-artist { font-size: 11px; opacity: 0.5; }

        .player-controls { display: flex; align-items: center; gap: 10px; margin-left: 10px; }
        .control-btn { background: none; border: none; color: white; cursor: pointer; opacity: 0.7; transition: 0.2s; }
        .control-btn:hover { opacity: 1; transform: scale(1.1); }

        /* Minimal Social Icons Row */
        .social-icons {
            display: flex; justify-content: center; gap: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }

        .icon-link { color: white; opacity: 0.4; transition: 0.3s; }
        .icon-link:hover { opacity: 1; transform: translateY(-3px); color: #fff; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://cdn.discordapp.com/avatars/627571292568027179/8cffb8462d38708c2e179f05db5190ff.webp" class="pfp" alt="Avatar">
        
        <span class="pronouns">he/him</span>
        <h1>@glittersdeath</h1>
        
        <div class="bio-container">
            <span id="typewriter"></span>
        </div>
        
        <span class="location">Studying at Leeds Conservatory</span>

        <!-- Music Player -->
        <div class="player-container">
            <img id="album-art" src="" class="album-art" alt="Art">
            <div class="track-info">
                <div class="track-status">Listening Now</div>
                <div id="track-name" class="track-name">Loading...</div>
                <div id="track-artist" class="track-artist">Artist</div>
            </div>
            <div class="player-controls">
                <button class="control-btn" onclick="prevTrack()"><i data-lucide="skip-back" size="16"></i></button>
                <button class="control-btn" onclick="nextTrack()"><i data-lucide="skip-forward" size="16"></i></button>
            </div>
        </div>
        
        <!-- Social Icons Only -->
        <div class="social-icons">
            <a href="https://www.roblox.com/users/685179066/profile" target="_blank" class="icon-link"><i data-lucide="gamepad-2"></i></a>
            <a href="https://www.youtube.com/@glittersdeathK" target="_blank" class="icon-link"><i data-lucide="youtube"></i></a>
            <a href="https://open.spotify.com/artist/5M45ri6PzJk2DOdXEEbfnl" target="_blank" class="icon-link"><i data-lucide="music"></i></a>
        </div>
    </div>

    <script>
        // --- Typewriter Settings ---
        const bioText = "drums are my honest passion";
        const titleText = "Link in Bio";
        let bioIndex = 0; let titleIndex = 0;
        const speed = 100;

        function typeTitle() {
            if (titleIndex < titleText.length) {
                document.title = titleText.substring(0, titleIndex + 1);
                titleIndex++;
                setTimeout(typeTitle, speed);
            } else { typeBio(); }
        }

        function typeBio() {
            if (bioIndex < bioText.length) {
                document.getElementById("typewriter").innerHTML += bioText.charAt(bioIndex);
                bioIndex++;
                setTimeout(typeBio, speed);
            }
        }

        // --- Playlist Data ---
        const playlist = [
            { name: "Earrings", artist: "Malcolm Todd", art: "https://scdn.co" },
            { name: "DSTYGE", artist: "Michael Jackson", art: "https://scdn.co" },
            { name: "Last Goodbye", artist: "Jeff Buckley", art: "https://scdn.co" },
            { name: "Show Me How", artist: "Men I Trust", art: "https://scdn.co" },
            { name: "Caravan", artist: "John Wasson", art: "https://scdn.co" },
            { name: "Don't Stop 'Til You Get Enough", artist: "Michael Jackson", art: "https://scdn.co" }
        ];

        let currentTrack = 0;

        function updatePlayer() {
            const track = playlist[currentTrack];
            document.getElementById('track-name').innerText = track.name;
            document.getElementById('track-artist').innerText = track.artist;
            document.getElementById('album-art').src = track.art;
        }

        function nextTrack() {
            currentTrack = (currentTrack + 1) % playlist.length;
            updatePlayer();
        }

        function prevTrack() {
            currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
            updatePlayer();
        }

        // Initialize Everything
        window.onload = () => {
            typeTitle();
            updatePlayer();
            lucide.createIcons(); // Initialize the icons
        };
    </script>

</body>
</html>
