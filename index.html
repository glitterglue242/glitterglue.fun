<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>glitterglue.fun</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

        :root {
            --pink: #ff00ff;
            --cyan: #00ffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'VT323', monospace;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rain {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .drop {
            position: absolute;
            width: 2px;
            height: 60px;
            background: linear-gradient(transparent, rgba(150, 220, 255, 0.7));
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(100vh); }
        }

        .card {
            background: rgba(15, 15, 28, 0.96);
            border: 2px solid #444;
            border-radius: 12px;
            width: 440px;
            max-width: 94vw;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 0 60px rgba(255, 0, 255, 0.25);
            position: relative;
            z-index: 2;
        }

        .avatar {
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 4px solid var(--pink);
            overflow: hidden;
            margin: 0 auto 1rem;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.6);
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2.4rem;
            color: var(--pink);
            text-shadow: 0 0 15px var(--pink);
        }

        .handle { color: var(--cyan); font-size: 1.45rem; margin: 0.4rem 0 1.2rem; }

        .bio {
            font-size: 1.35rem;
            line-height: 1.4;
            color: #bbb;
            margin-bottom: 1.8rem;
        }

        .now-playing {
            background: #1a1a2e;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 1rem;
            margin: 1.5rem 0;
        }

        .song-title { font-size: 1.5rem; margin-bottom: 0.3rem; }
        .artist { color: var(--cyan); }

        .player-container {
            margin: 1rem 0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .song-list {
            margin-top: 1.5rem;
        }

        .song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(30, 30, 50, 0.7);
            margin-bottom: 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .song-item:hover {
            background: rgba(255, 0, 255, 0.2);
            transform: translateX(6px);
        }

        .song-item.playing {
            background: rgba(0, 255, 255, 0.15);
            border-left: 5px solid var(--cyan);
        }

        footer {
            margin-top: 2rem;
            color: #555;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="rain" id="rain"></div>

    <div class="card">
        <div class="avatar">
            <img src="avatar.jpg" alt="glitterglue">
        </div>
        
        <h1>glitterglue</h1>
        <div class="handle">@glitterglue.fun</div>
        
        <p class="bio">
            glitter gremlin • professional yapper<br>
            currently rotting with headphones on
        </p>

        <!-- Now Playing -->
        <div class="now-playing" id="now-playing">
            <div style="margin-bottom:8px; color:#888;">♪ NOW PLAYING</div>
            <div class="song-title" id="current-title">earrings</div>
            <div class="artist" id="current-artist">Malcolm Todd</div>
            
            <div class="player-container" id="player-container">
                <!-- YouTube embed will go here via JS -->
            </div>
        </div>

        <!-- Song List -->
        <div class="song-list" id="song-list"></div>

        <footer>glitterglue.fun</footer>
    </div>

    <script>
        const songs = [
            {
                title: "earrings",
                artist: "Malcolm Todd",
                youtube: "https://www.youtube.com/embed/yDSQB-zNJE4"   // lyrics video
            },
            {
                title: "YKWIM?",
                artist: "Yot Club",
                youtube: "https://www.youtube.com/embed/DtsUOWVB9Dg"
            },
            {
                title: "Show Me How",
                artist: "Men I Trust",
                youtube: "https://www.youtube.com/embed/3n5wH5q5q5Q"   // replace if better link found
            },
            {
                title: "Don't Stop 'Til You Get Enough",
                artist: "Michael Jackson",
                youtube: "https://www.youtube.com/embed/yJQ2v3f7z0A"
            },
            {
                title: "IFHY",
                artist: "Tyler, The Creator ft. Pharrell",
                youtube: "https://www.youtube.com/embed/3n5wH5q5q5Q"   // placeholder — replace with real link
            }
        ];

        let currentIndex = 0;

        function renderSongs() {
            const container = document.getElementById('song-list');
            container.innerHTML = '';

            songs.forEach((song, i) => {
                const div = document.createElement('div');
                div.className = `song-item ${i === currentIndex ? 'playing' : ''}`;
                div.innerHTML = `
                    <div>
                        <strong>${song.title}</strong><br>
                        <span style="color:#999">${song.artist}</span>
                    </div>
                    <span style="font-size:1.8rem; color:var(--pink)">▶</span>
                `;
                div.onclick = () => playSong(i);
                container.appendChild(div);
            });
        }

        function playSong(index) {
            currentIndex = index;
            const song = songs[index];

            document.getElementById('current-title').textContent = song.title;
            document.getElementById('current-artist').textContent = song.artist;

            const playerHTML = `
                <iframe width="100%" height="120" 
                    src="${song.youtube}" 
                    title="YouTube video player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
            document.getElementById('player-container').innerHTML = playerHTML;

            renderSongs();
        }

        // Rain effect
        function createRain() {
            const rain = document.getElementById('rain');
            for (let i = 0; i < 90; i++) {
                const drop = document.createElement('div');
                drop.className = 'drop';
                drop.style.left = Math.random() * 100 + 'vw';
                drop.style.animationDuration = (Math.random() * 0.5 + 0.4) + 's';
                drop.style.animationDelay = Math.random() * 3 + 's';
                drop.style.opacity = Math.random() * 0.5 + 0.5;
                rain.appendChild(drop);
            }
        }

        // Init
        window.onload = () => {
            createRain();
            renderSongs();
            playSong(0); // start with first song
        };
    </script>
</body>
</html>
