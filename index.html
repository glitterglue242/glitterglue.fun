<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<head>
  <link rel="icon" type="image/png" href="assets/icons/cat.png">
</head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>topz is gay asf</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:         #0a0a0a;
  --card:       #111111;
  --btn-bg:     #1a1a1a;
  --btn-hover:  #222222;

  --accent:     #f5f5f5;
  --accent2:    #cccccc;

  --text:       #f5f5f5;
  --muted:      #888888;

  --a05:  color-mix(in srgb, var(--accent) 5%,  transparent);
  --a08:  color-mix(in srgb, var(--accent) 8%,  transparent);
  --a10:  color-mix(in srgb, var(--accent) 10%, transparent);
  --a12:  color-mix(in srgb, var(--accent) 12%, transparent);
  --a15:  color-mix(in srgb, var(--accent) 15%, transparent);
  --a18:  color-mix(in srgb, var(--accent) 18%, transparent);
  --a20:  color-mix(in srgb, var(--accent) 20%, transparent);
  --a25:  color-mix(in srgb, var(--accent) 25%, transparent);
  --a28:  color-mix(in srgb, var(--accent) 28%, transparent);
  --a30:  color-mix(in srgb, var(--accent) 30%, transparent);
  --a35:  color-mix(in srgb, var(--accent) 35%, transparent);
  --a40:  color-mix(in srgb, var(--accent) 40%, transparent);
  --a50:  color-mix(in srgb, var(--accent) 50%, transparent);
  --a55:  color-mix(in srgb, var(--accent) 55%, transparent);
  --a60:  color-mix(in srgb, var(--accent) 60%, transparent);
  --a70:  color-mix(in srgb, var(--accent) 70%, transparent);
  --a80:  color-mix(in srgb, var(--accent) 80%, transparent);
  --a90:  color-mix(in srgb, var(--accent) 90%, transparent);
  --a99:  color-mix(in srgb, var(--accent) 99%, transparent);
  --acc:  color-mix(in srgb, var(--accent) 80%, transparent);
}

html {
  height: 100%;
}

body {
  font-family: 'Syne', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  height: 100dvh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  overflow: hidden;
  perspective: 1200px;
}


body.is-desktop,
body.is-desktop a,
body.is-desktop button { cursor: none !important; }

#rain-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0; opacity: 0.75;
}

.bg-orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
.orb1 { width: 600px; height: 600px; top: -200px; left: -180px; background: radial-gradient(circle, var(--a30) 0%, transparent 65%); }
.orb2 { width: 500px; height: 500px; bottom: -150px; right: -150px; background: radial-gradient(circle, var(--a15) 0%, transparent 65%); }
.orb3 { width: 300px; height: 300px; top: 40%; left: 60%; background: radial-gradient(circle, var(--a10) 0%, transparent 70%); }

#enter-screen {
  position: fixed; inset: 0; z-index: 100;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2rem;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
#enter-screen.hidden { 
  opacity: 0; 
  visibility: hidden; 
}

.enter-logo {
  font-size: 3rem; font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent2), var(--muted));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: epulse 2s ease-in-out infinite;
}
@keyframes epulse {
  0%, 100% { filter: drop-shadow(0 0 10px var(--a60)); }
  50%       { filter: drop-shadow(0 0 32px var(--acc)); }
}

.enter-btn {
  background: transparent;
  border: 1px solid var(--a50);
  border-radius: 99px;
  padding: 14px 44px;
  color: var(--text);
  font-family: 'Syne', sans-serif;
  font-size: 0.9rem;
  letter-spacing: 0.15em;
  transition: border-color 0.3s, transform 0.2s, box-shadow 0.3s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.enter-btn:hover, .enter-btn:active {
  border-color: var(--accent);
  transform: scale(1.05);
  box-shadow: 0 0 28px var(--a30);
}

.enter-sub {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem; color: var(--muted);
  letter-spacing: 0.1em;
  animation: blink 1.5s step-end infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

#tilt-wrapper {
  position: relative; z-index: 1;
  width: 100%; max-width: 600px;
  transform-style: preserve-3d;
  transform: rotateX(0deg) rotateY(0deg);
  transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
  opacity: 0;
}
#tilt-wrapper.visible {
  opacity: 1;
  transition: opacity 0.8s ease, transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}
#tilt-wrapper.tilting { transition: transform 0.08s linear; }

.card {
  background: linear-gradient(160deg, #1a1a1a 0%, var(--card) 50%, #141414 100%);
  border: 1px solid var(--a20);
  border-radius: 24px;
  padding: 2.4rem 2.6rem 3rem;
  text-align: center;
  position: relative;
  transform-style: preserve-3d;
  box-shadow: 0 20px 70px #00000080, 0 2px 0 var(--a10) inset;
  transition: box-shadow 0.4s ease;
  overflow: visible;
  -webkit-tap-highlight-color: transparent;
}

@media (max-width: 480px) {
  html, body {
    height: 100%;
    height: 100dvh;
    overflow-y: auto;
  }
  body {
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  #tilt-wrapper {
    width: 100%;
    max-width: 100%;
  }
  .card {
    padding: 1.5rem 1.1rem;
    border-radius: 18px;
    width: 100%;
  }
  .avatar { width: 72px; height: 72px; }
  .username { font-size: 1.35rem; }
  .bio { font-size: 0.9rem; }
  .sp-title { font-size: 0.75rem; }
  .sp-art { width: 36px; height: 36px; }
  .sp-btn.play { width: 30px; height: 30px; }
  .sp-btn.play svg { width: 13px; height: 13px; }
  .sp-btn svg { width: 15px; height: 15px; }
  .icon-btn { width: 44px; height: 44px; }
}

@media (min-width: 481px) and (max-height: 780px) {
  .card { padding: 1.6rem 2rem; }
  .avatar { width: 72px; height: 72px; }
  .avatar-wrap { margin-bottom: 0.7rem; }
  .username { font-size: 1.35rem; min-height: 1.6rem; }
  .handle { font-size: 0.7rem; margin-bottom: 0.6rem; }
  .bio { font-size: 0.88rem; margin-bottom: 0.8rem; }
  .badges { margin-bottom: 0.8rem; gap: 4px; }
  .divider { margin: 0.6rem 0; }
  .spotify-bar { padding: 9px 11px; margin-bottom: 0.7rem; }
  .sp-art { width: 36px; height: 36px; }
  .sp-label { font-size: 0.55rem; }
  .sp-title { font-size: 0.76rem; }
  .sp-artist { font-size: 0.62rem; }
  .sp-progress-wrap { margin-top: 5px; }
  .links { gap: 9px; padding-top: 5px; }
  .icon-btn { width: 42px; height: 42px; }
  .views { margin-top: 0.8rem; }
}

@media (min-width: 481px) and (max-height: 640px) {
  .card { padding: 1.1rem 1.6rem; }
  .avatar { width: 60px; height: 60px; }
  .avatar-wrap { margin-bottom: 0.5rem; }
  .username { font-size: 1.15rem; min-height: 1.4rem; }
  .handle { font-size: 0.65rem; margin-bottom: 0.4rem; }
  .bio { font-size: 0.8rem; margin-bottom: 0.6rem; min-height: 1.4rem; }
  .badges { margin-bottom: 0.6rem; }
  .badge { font-size: 0.6rem; padding: 2px 8px; }
  .divider { margin: 0.4rem 0; }
  .spotify-bar { padding: 7px 9px; margin-bottom: 0.5rem; gap: 8px; }
  .sp-art { width: 30px; height: 30px; }
  .sp-btn.play { width: 28px; height: 28px; }
  .sp-btn.play svg { width: 12px; height: 12px; }
  .sp-btn svg { width: 14px; height: 14px; }
  .sp-progress-wrap { margin-top: 4px; }
  .links { gap: 7px; padding-top: 4px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 11px; }
  .views { margin-top: 0.5rem; font-size: 0.6rem; }
}

@media (max-width: 480px) {
  .icon-btn:active, .icon-btn.touch-hover {
    color: var(--accent);
    transform: translateY(-4px) scale(1.35);
  }
  .icon-btn:active svg, .icon-btn.touch-hover svg {
    filter: drop-shadow(0 0 10px var(--accent)) drop-shadow(0 0 22px var(--a99));
  }
  .icon-btn:active .img-wrap, .icon-btn.touch-hover .img-wrap {
    filter: drop-shadow(0 0 10px var(--accent)) drop-shadow(0 0 22px var(--a99));
  }
  .icon-btn:active .img-wrap img, .icon-btn.touch-hover .img-wrap img {
    filter: brightness(0) invert(1) opacity(1);
  }
}

.card.glow {
  box-shadow: 0 0 60px var(--a28), 0 0 120px var(--a08),
              0 20px 70px #00000080, 0 2px 0 var(--a10) inset;
}

.card-depth  { position: absolute; inset: 0; border-radius: 24px; transform: translateZ(-8px) scale(1.02); border: 1px solid var(--a18); pointer-events: none; }
.card-depth2 { position: absolute; inset: 0; border-radius: 24px; transform: translateZ(-16px) scale(1.04); border: 1px solid var(--a10); pointer-events: none; }

.volume-ctrl {
  position: fixed; top: 20px; right: 24px;
  display: flex; align-items: center; gap: 7px;
  z-index: 200;
  background: color-mix(in srgb, var(--card) 80%, transparent);
  border: 1px solid var(--a30);
  border-radius: 99px; padding: 7px 14px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
@media (max-width: 480px) { .volume-ctrl { top: 12px; right: 12px; padding: 6px 10px; } }

.vol-icon { display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; width: 16px; height: 16px; }
.vol-icon svg { display: block; }
.vol-slider {
  -webkit-appearance: none; appearance: none;
  width: 72px; height: 3px; border-radius: 99px;
  background: linear-gradient(to right, var(--accent) var(--val, 80%), #ffffff18 var(--val, 80%));
  outline: none; touch-action: none;
}
.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 6px var(--a70);
}
.vol-slider::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); border: none; box-shadow: 0 0 6px var(--a70);
}

.avatar-wrap { position: relative; display: inline-block; margin-bottom: 1.1rem; transform: translateZ(20px); }
.avatar {
  width: 88px; height: 88px; border-radius: 50%;
  border: 2px solid var(--accent);
  object-fit: cover;
  box-shadow: 0 0 28px var(--a55);
  display: block;
}
.status-dot {
  position: absolute; bottom: 4px; right: 4px;
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--card);
  box-shadow: 0 0 10px var(--a80);
}

.username {
  font-size: 1.65rem; font-weight: 800; display: block;
  color: var(--accent);
  margin-bottom: 0.25rem; transform: translateZ(15px);
  min-height: 2rem; letter-spacing: 0.01em;
}
.username .name-cursor {
  display: inline-block; width: 2px; height: 1em;
  background: var(--accent); margin-left: 2px; vertical-align: middle;
  animation: blink 0.8s step-end infinite;
}

.handle { font-family: 'DM Mono', monospace; font-size: 0.76rem; color: var(--muted); margin-bottom: 0.9rem; }

.bio {
  font-size: 1rem; font-weight: 700; line-height: 1.6;
  margin-bottom: 1.2rem; padding: 0 0.4rem; min-height: 1.8rem;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--muted), var(--accent));
  background-size: 200% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradshift 4s linear infinite;
}
@keyframes gradshift { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
.bio .cursor {
  display: inline-block; width: 2px; height: 1em;
  background: var(--accent) !important; margin-left: 2px; vertical-align: middle;
  animation: blink 0.8s step-end infinite;
  -webkit-text-fill-color: initial; background-clip: initial !important; -webkit-background-clip: initial !important;
}

.badges { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 1.2rem; transform: translateZ(8px); }
.badge {
  font-family: 'DM Mono', monospace; font-size: 0.65rem;
  padding: 3px 10px; border-radius: 99px;
  border: 1px solid var(--a20); color: var(--muted); background: var(--btn-bg);
}
.badge.special {
  border-color: var(--a40); color: var(--accent2);
  background: linear-gradient(135deg, var(--a12), var(--a08));
}

.divider { height: 1px; background: linear-gradient(90deg, transparent, var(--a25), transparent); margin: 1rem 0; }

.spotify-bar {
  background: #0a0a0a; border: 1px solid var(--a30);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 1rem;
  display: flex; align-items: center; gap: 12px;
  transform: translateZ(6px);
}

.sp-art {
  width: 42px; height: 42px; border-radius: 8px;
  background: linear-gradient(135deg, #1a1a1a, #111111);
  border: 1px solid var(--a20);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 18px; overflow: hidden; position: relative;
}
.sp-art img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: none; }
.sp-art img.loaded { display: block; }
.sp-art img.loaded + .sp-art-emoji { display: none; }

.sp-info { flex: 1; text-align: left; overflow: hidden; }
.sp-title  { font-size: 0.82rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-artist { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); }
.sp-label  { font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--accent); margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
.sp-dot    { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: spdot 1.5s ease infinite; flex-shrink: 0; }
@keyframes spdot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.6); } }

.sp-progress-wrap { margin-top: 8px; display: flex; align-items: center; gap: 6px; }
.sp-time { font-family: 'DM Mono', monospace; font-size: 0.55rem; color: var(--muted); flex-shrink: 0; width: 28px; }
.sp-time.right { text-align: right; }

.sp-progress {
  flex: 1; height: 6px; background: #ffffff15;
  border-radius: 99px; overflow: visible; position: relative; touch-action: none;
}
.sp-progress-inner { position: relative; width: 100%; height: 100%; border-radius: 99px; overflow: hidden; }
.sp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px; width: 0%;
  transition: width 0.3s linear; pointer-events: none;
}
.sp-fill.seeking { transition: none; }

.sp-thumb {
  position: absolute; top: 50%; right: -6px;
  width: 12px; height: 12px; border-radius: 50%;
  background: #fff; transform: translateY(-50%) scale(0);
  transition: transform 0.15s ease; pointer-events: none;
  box-shadow: 0 0 6px var(--a80);
}
.sp-progress:hover .sp-thumb,
.sp-progress.dragging .sp-thumb { transform: translateY(-50%) scale(1); }
.sp-progress.dragging .sp-fill  { transition: none; }

.sp-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

.sp-btn {
  background: transparent; border: none; color: var(--muted); padding: 6px;
  transition: color 0.2s, transform 0.15s; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.sp-btn:hover, .sp-btn:active { color: var(--text); transform: scale(1.15); }
.sp-btn svg { width: 18px; height: 18px; display: block; }

.sp-btn.play {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000;
  padding: 0;
}
.sp-btn.play svg { width: 16px; height: 16px; }
.sp-btn.play:hover, .sp-btn.play:active {
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  transform: scale(1.1);
}

.links {
  display: flex; flex-direction: row;
  justify-content: center; align-items: center;
  gap: 12px; transform: translateZ(4px); flex-wrap: wrap;
  overflow: visible;
  padding-top: 8px;
  padding-bottom: 48px;
}

.icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; border-radius: 14px;
  background: transparent; border: none;
  color: var(--muted); text-decoration: none; font-size: 20px;
  transition: color 0.2s, transform 0.2s, filter 0.2s;
  position: relative; overflow: visible;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.icon-btn .tip { display: none; }
.icon-btn svg {
  width: 26px; height: 26px; display: block; flex-shrink: 0; fill: currentColor;
  filter: drop-shadow(0 0 px var(--a40));
  transition: filter 0.2s;
}
.icon-btn:hover, .icon-btn:active {
  color: var(--accent);
  transform: translateY(-4px) scale(1.35);
}
.icon-btn:hover svg, .icon-btn:active svg {
  filter: drop-shadow(0 0 6px var(--accent)) drop-shadow(0 0 12px var(--a60));
}

.img-wrap {
  display: flex; align-items: center; justify-content: center;
  transition: filter 0.2s;
  filter: drop-shadow(0 0 px var(--a40));
}
.img-wrap img {
  width: 26px; height: 26px;
  filter: brightness(0) invert(1) opacity(0.55);
  display: block; transition: filter 0.2s;
}
.icon-btn:hover .img-wrap, .icon-btn:active .img-wrap {
  filter: drop-shadow(0 0 10px var(--accent)) drop-shadow(0 0 22px var(--a99));
}
.icon-btn:hover .img-wrap img, .icon-btn:active .img-wrap img {
  filter: brightness(0) invert(1) opacity(1);
}

#floating-tip {
  position: fixed;
  background: var(--btn-bg); border: 1px solid var(--a30);
  color: var(--muted); font-family: 'DM Mono', monospace;
  font-size: 0.62rem; white-space: nowrap;
  padding: 4px 10px; border-radius: 6px;
  pointer-events: none; z-index: 999999; opacity: 0;
  transition: opacity 0.15s ease; transform: translateX(-50%);
}

.views { position: absolute; bottom: 14px; right: 16px; }

.views-bubble {
  display: inline-flex; align-items: center; gap: 7px;
  background: linear-gradient(135deg, var(--a12), var(--a08));
  border: 1px solid var(--a35); border-radius: 99px;
  padding: 5px 13px 5px 9px; opacity: 0;
  transform: translateY(6px) scale(0.94);
  transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 0 14px var(--a10), inset 0 1px 0 var(--a18);
  position: relative; overflow: hidden;
}
.views-bubble::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, var(--a08) 50%, transparent 100%);
  background-size: 200% 100%;
  animation: shimmer 3s ease infinite; border-radius: 99px;
}
@keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
.views-bubble.loaded { opacity: 1; transform: translateY(0) scale(1); }

.views-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 6px var(--a90);
  animation: spdot 2s ease infinite; flex-shrink: 0; position: relative; z-index: 1;
}
.views-count-num {
  font-family: 'DM Mono', monospace; font-weight: 500; font-size: 0.72rem;
  color: var(--accent2); letter-spacing: 0.06em; position: relative; z-index: 1;
}
.views-label {
  font-family: 'DM Mono', monospace; font-size: 0.6rem;
  color: var(--a90); letter-spacing: 0.04em; position: relative; z-index: 1;
}

#cursor-dot, #cursor-ring { display: none; }
body.is-desktop #cursor-dot,
body.is-desktop #cursor-ring { display: block; }

#cursor-dot {
  position: fixed; top: 0; left: 0;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent); pointer-events: none; z-index: 99999;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 10px var(--accent), 0 0 22px var(--a80);
  transition: transform 0.05s, width 0.2s, height 0.2s;
  mix-blend-mode: screen;
}
#cursor-ring {
  position: fixed; top: 0; left: 0;
  width: 36px; height: 36px; border-radius: 50%;
  border: 1.5px solid var(--a80); pointer-events: none; z-index: 99998;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px var(--a40);
  transition: width 0.2s, height 0.2s, border-color 0.2s, opacity 0.2s;
}

.trail-dot {
  position: fixed; border-radius: 50%; pointer-events: none; z-index: 99990;
  transform: translate(-50%, -50%); mix-blend-mode: screen; display: none;
}
body.is-desktop .trail-dot { display: block; }

.spark {
  position: fixed; pointer-events: none;
  z-index: 99995; width: 6px; height: 6px; border-radius: 50%;
  animation: spark-fly 0.6s ease forwards;
}
@keyframes spark-fly {

<script>
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)

document.body.classList.add(isMobile ? 'is-mobile' : 'is-desktop');

(function() {
  const canvas = document.getElementById('rain-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, drops = [];
  const DROP_COUNT = isMobile ? 100 : 200;

  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  function randBetween(a, b) { return a + Math.random() * (b - a); }
  function createDrop() {
    return { x: randBetween(0, W), y: randBetween(-H, 0), len: randBetween(30, 70), speed: randBetween(14, 30), opacity: randBetween(0.4, 0.9), width: randBetween(1.0, 2.2), angle: randBetween(-0.04, 0.04) };
  }
  for (let i = 0; i < DROP_COUNT; i++) { const d = createDrop(); d.y = randBetween(-H, H); drops.push(d); }

  const splashes = [];
  function addSplash(x, y) {
    const count = Math.floor(randBetween(2, 5));
    for (let i = 0; i < count; i++) splashes.push({ x, y, vx: randBetween(-1.2, 1.2), vy: randBetween(-1.5, -0.3), life: 1, decay: randBetween(0.06, 0.14), r: randBetween(1, 2.5) });
  }

  function getAccentRgb() {
    const v = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const c = document.createElement('canvas'); c.width = c.height = 1;
    const x = c.getContext('2d'); x.fillStyle = v; x.fillRect(0,0,1,1);
    const d = x.getImageData(0,0,1,1).data;
    return [d[0], d[1], d[2]];
  }
  let accentRgb = [255,255,255];
  setTimeout(() => { accentRgb = getAccentRgb(); }, 100);

function drawRain() {
  ctx.clearRect(0, 0, W, H);
  const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  
  drops.forEach(d => {
    const dx = Math.sin(d.angle) * d.len, dy = Math.cos(d.angle) * d.len;
    const grad = ctx.createLinearGradient(d.x, d.y, d.x + dx, d.y + dy);
    grad.addColorStop(0, `rgba(110, 110, 110, 0)`);
    grad.addColorStop(0.5, `rgba(200, 200, 200, ${d.opacity * 0.7})`);
    grad.addColorStop(1, `${accentColor.replace(')', `, ${d.opacity})`).replace('rgb', 'rgba')}`);
    ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + dx, d.y + dy);
    ctx.strokeStyle = `rgba(255, 255, 255, ${d.opacity * 0.3})`;
    ctx.lineWidth = d.width; ctx.lineCap = 'round'; ctx.stroke();
      ctx.strokeStyle = grad; ctx.lineWidth = d.width; ctx.lineCap = 'round'; ctx.stroke();
      d.x += d.speed * Math.sin(d.angle); d.y += d.speed;
      if (d.y - d.len > H) { addSplash(d.x, H - 1); Object.assign(d, createDrop()); d.y = -d.len; }
      if (d.x > W + 20) d.x = -20;
      if (d.x < -20)    d.x = W + 20;
    });
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${accentRgb[0]},${accentRgb[1]},${accentRgb[2]},${s.life * 0.5})`; ctx.fill();
      s.x += s.vx; s.y += s.vy; s.vy += 0.12; s.life -= s.decay;
      if (s.life <= 0) splashes.splice(i, 1);
    }
    requestAnimationFrame(drawRain);
  }
  drawRain();
})();

function animateCount(el, target) {
  const duration = 1200, start = performance.now(), startVal = 0;
  function step(now) {
    const elapsed = now - start, progress = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.round(startVal + (target - startVal) * ease).toLocaleString();
    if (progress < 1) requestAnimationFrame(step); else el.textContent = target.toLocaleString();
  }
  requestAnimationFrame(step);
}

let current = 0, playing = false, progTimer = null;

  low:  '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>',

};

  clearInterval(progTimer);

    if (!isDragging && audio.duration) {
      const pct = audio.currentTime / audio.duration * 100;

}

let isDragging = false;

function seekTo(clientX) {
  const rect = spProg.getBoundingClientRect();
  let pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  if (audio.duration) { audio.currentTime = pct * audio.duration; spFill.style.width = (pct * 100) + '%'; spCurEl.textContent = fmtTime(audio.currentTime); }
}

const MAX_TILT = 18;

function getAccentHex() { return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(); }

function applyTilt(rx, ry) {
  wrapper.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
  const sx = ry * 1.2, sy = -rx * 1.2;
  const a = getAccentHex();
  card.style.boxShadow = card.classList.contains('glow')
    ? `${sx}px ${sy + 20}px 60px #00000080, 0 0 60px ${a}28`
    : `${sx}px ${sy + 20}px 60px #00000080`;
}

function resetTilt() {
  wrapper.classList.remove('tilting');
  wrapper.style.transform = 'rotateX(0deg) rotateY(0deg)';
  const a = getAccentHex();
  card.style.boxShadow = card.classList.contains('glow')
    ? `0 0 60px ${a}28, 0 0 120px ${a}08, 0 20px 70px #00000080`
    : '0 20px 70px #00000080';
}

if (!isMobile) {
  wrapper.addEventListener('mouseenter', () => { isHovering = true; wrapper.classList.add('tilting'); });
  wrapper.addEventListener('mouseleave', () => { isHovering = false; resetTilt(); });
  wrapper.addEventListener('mousemove', (e) => {
    if (!isHovering) return;
    const rect = wrapper.getBoundingClientRect();
const dx = (e.clientX - rect.left) / rect.width  - 0.5;
const dy = (e.clientY - rect.top)  / rect.height - 0.5;
applyTilt(-dy * MAX_TILT * 2, dx * MAX_TILT * 2);  });
} else {
  let tiltTouchId = null, tiltStartX = 0, tiltStartY = 0, tiltActive = false;
  wrapper.addEventListener('touchstart', (e) => {
    if (e.target.closest('#sp-progress')) return;
    const t = e.changedTouches[0]; tiltTouchId = t.identifier; tiltStartX = t.clientX; tiltStartY = t.clientY; tiltActive = false; wrapper.classList.add('tilting');
  }, { passive: true });
  wrapper.addEventListener('touchmove', (e) => {
    if (e.target.closest('#sp-progress')) return;
    let touch = null;
    for (let i = 0; i < e.changedTouches.length; i++) { if (e.changedTouches[i].identifier === tiltTouchId) { touch = e.changedTouches[i]; break; } }
    if (!touch) return;
    const dx = touch.clientX - tiltStartX, dy = touch.clientY - tiltStartY;
    if (!tiltActive && Math.abs(dx) > Math.abs(dy) + 5) tiltActive = true;
    if (!tiltActive) return;
    e.preventDefault();
    const rect = wrapper.getBoundingClientRect();
    const nx = (touch.clientX - rect.left) / rect.width  - 0.5;
const ny = (touch.clientY - rect.top)  / rect.height - 0.5;
applyTilt(-ny * MAX_TILT * 1.4, nx * MAX_TILT * 1.4);
  }, { passive: false });
  wrapper.addEventListener('touchend', () => { tiltTouchId = null; tiltActive = false; resetTilt(); }, { passive: true });
  wrapper.addEventListener('touchcancel', () => { tiltTouchId = null; tiltActive = false; resetTilt(); }, { passive: true });
}

function spawnSparks(cx, cy) {
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const accent2 = getComputedStyle(document.documentElement).getPropertyValue('--accent2').trim();
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const angle = (Math.PI * 2 / 8) * i, dist = 30 + Math.random() * 45;
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.setProperty('--tx', `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`);
    s.style.background = i % 2 === 0 ? accent : accent2;
    s.style.animationDelay = (Math.random() * 0.1) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 700);
  }
}
document.addEventListener('click', (e) => spawnSparks(e.clientX, e.clientY));

if (!isMobile) {
  const dot = document.getElementById('cursor-dot');
  const ring = document.getElementById('cursor-ring');
  const TRAIL_COUNT = 12;
  const trail = [];
  let mx = window.innerWidth / 2, my = window.innerHeight / 2, rx2 = mx, ry2 = my;

  for (let i = 0; i < TRAIL_COUNT; i++) {
    const d = document.createElement('div');
    d.className = 'trail-dot';
    const t = 1 - i / TRAIL_COUNT, size = Math.round(8 * t);
    d.style.width = size + 'px'; d.style.height = size + 'px';
    d.style.opacity = (t * 0.6).toFixed(2);
    d.style.background = `hsl(0, 0%, ${Math.round(70 + i * 2)}%)`;
    d.style.boxShadow = `0 0 ${Math.round(6 * t)}px hsl(0, 0%, 80%)`;
    document.body.appendChild(d);
    trail.push({ el: d, x: 0, y: 0 });
  }

  document.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; dot.style.left = mx + 'px'; dot.style.top = my + 'px'; });

  document.querySelectorAll('a, button, .icon-btn, .sp-progress, .vol-slider').forEach(el => {
    el.addEventListener('mouseenter', () => { dot.style.width = '6px'; dot.style.height = '6px'; ring.style.width = '52px'; ring.style.height = '52px'; ring.style.borderColor = 'var(--accent)'; ring.style.boxShadow = '0 0 18px var(--a60)'; });
    el.addEventListener('mouseleave', () => { dot.style.width = '10px'; dot.style.height = '10px'; ring.style.width = '36px'; ring.style.height = '36px'; ring.style.borderColor = 'var(--a80)'; ring.style.boxShadow = '0 0 8px var(--a40)'; });
  });

  document.addEventListener('mousedown', () => { dot.style.transform = 'translate(-50%,-50%) scale(0.6)'; ring.style.transform = 'translate(-50%,-50%) scale(1.4)'; ring.style.opacity = '0.4'; });
  document.addEventListener('mouseup',   () => { dot.style.transform = 'translate(-50%,-50%) scale(1)';   ring.style.transform = 'translate(-50%,-50%) scale(1)';   ring.style.opacity = '1'; });

  let positions = Array(TRAIL_COUNT).fill(null).map(() => ({ x: mx, y: my }));
  function animateCursor() {
    rx2 += (mx - rx2) * 0.15; ry2 += (my - ry2) * 0.15;
    ring.style.left = rx2 + 'px'; ring.style.top = ry2 + 'px';
    positions.unshift({ x: mx, y: my });
    positions = positions.slice(0, TRAIL_COUNT);
    for (let i = 0; i < TRAIL_COUNT; i++) { const p = positions[Math.min(i, positions.length - 1)]; trail[i].el.style.left = p.x + 'px'; trail[i].el.style.top = p.y + 'px'; }
    requestAnimationFrame(animateCursor);
  }
  animateCursor();

  const floatingTip = document.getElementById('floating-tip');
  let tipTimeout = null;
  document.querySelectorAll('.icon-btn').forEach(btn => {
    const label = btn.querySelector('.tip')?.textContent || '';
    btn.addEventListener('mouseenter', () => {
      clearTimeout(tipTimeout);
      const rect = btn.getBoundingClientRect();
      floatingTip.textContent = label;
      floatingTip.style.left = (rect.left + rect.width / 2) + 'px';
      floatingTip.style.top  = (rect.top - 10) + 'px';
      floatingTip.style.transform = 'translateX(-50%) translateY(-100%)';
      floatingTip.style.opacity = '1';
    });
    btn.addEventListener('mouseleave', () => { tipTimeout = setTimeout(() => { floatingTip.style.opacity = '0'; }, 80); });
  });
}

if (isMobile) {
  const iconBtns = document.querySelectorAll('.icon-btn');
  
  document.addEventListener('touchmove', (e) => {
    const touch = e.touches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const btn = el?.closest('.icon-btn');
    
    iconBtns.forEach(b => b.classList.remove('touch-hover'));
    if (btn) btn.classList.add('touch-hover');
  }, { passive: true });
  
  document.addEventListener('touchend', () => {
    iconBtns.forEach(b => b.classList.remove('touch-hover'));
  }, { passive: true });
}

</script>
