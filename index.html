<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>glitterglue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #111;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
        }
        .pfp {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #a855f7;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
            margin-bottom: 12px;
        }
        .name {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 20px;
            font-size: 15px;
        }
        .meta-tags {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .tag {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #c4b5fd;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        /* Music Player */
        .music-player {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #222;
        }
        .now-playing {
            font-size: 13px;
            color: #a1a1aa;
            margin-bottom: 12px;
            text-align: center;
        }
        #album-art {
            width: 100%;
            max-width: 260px;
            border-radius: 12px;
            margin: 0 auto 15px;
            display: block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        #song-title {
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 4px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin: 18px 0;
        }
        button {
            background: none;
            border: none;
            color: #c4b5fd;
            font-size: 26px;
            cursor: pointer;
        }
        #play-btn {
            background: #a855f7;
            color: white;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
        }
        input[type="range"] {
            width: 100%;
            accent-color: #a855f7;
        }

        /* Playlist */
        #playlist div {
            padding: 9px 0;
            cursor: pointer;
            border-bottom: 1px solid #222;
        }
        #playlist div:hover {
            color: #c4b5fd;
        }

        /* Rotating Facts */
        .rotating-things {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            min-height: 75px;
            border: 1px solid #222;
            color: #c4b5fd;
            font-size: 15px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="pfp" src="https://kappa.lol/q3cOI9" alt="glitterglue">

        <div class="name">glitterglue</div>
        <div class="subtitle">@glitterglue.fun</div>

        <div class="meta-tags">
            <span class="tag">he/him</span>
            <span class="tag">Portsmouth, UK</span>
        </div>

        <!-- MUSIC PLAYER -->
        <div class="music-player">
            <div class="now-playing">♪ NOW PLAYING</div>
            
            <img id="album-art" src="assets/Big Poe.jpg" alt="album art">
            
            <p id="song-title">Big POE</p>
            
            <audio id="audio" style="display: none;">
                <source src="assets/Big Poe.mp3" type="audio/mpeg">
            </audio>

            <div class="controls">
                <button onclick="prevSong()">⫻</button>
                <button id="play-btn" onclick="togglePlay()">▶</button>
                <button onclick="nextSong()">⫻</button>
            </div>

            <input type="range" id="progress" value="0" max="100">

            <div id="playlist" style="margin-top: 20px; text-align: left; font-size: 14px;"></div>
        </div>

        <!-- FIVE THINGS ROTATOR -->
        <div class="rotating-things">
            <div id="rotating-text"></div>
        </div>
    </div>

    <script>
        // Music Player
        const songs = [
            { title: "Big POE", file: "assets/Big Poe.mp3", cover: "assets/Big POe.jpg" },
            { title: "Billie Jean", file: "assets/Billie Jean.mp3", cover: "assets/Billie Jean.jpg" },
            { title: "Earrings", file: "assets/Earrings.mp3", cover: "assets/Earrings.jpg" },
            { title: "Im Bo Yo", file: "assets/Im Bo Yo.mp3", cover: "assets/Im Bo Yo.jpg" },
            { title: "Last Goodbye", file: "assets/Last Goodbye.mp3", cover: "assets/grace.jpg" },
            { title: "Lover, You Should've Come Over", file: "assets/Lover, You Should've come over.mp3", cover: "assets/grace.jpg" }
        ];

        let currentSong = 0;
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play-btn');
        const albumArt = document.getElementById('album-art');
        const songTitle = document.getElementById('song-title');
        const progress = document.getElementById('progress');

        function loadSong(index) {
            audio.src = songs[index].file;
            albumArt.src = songs[index].cover;
            songTitle.textContent = songs[index].title;
            progress.value = 0;
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.textContent = '❚❚';
            } else {
                audio.pause();
                playBtn.textContent = '▶';
            }
        }

        function nextSong() {
            currentSong = (currentSong + 1) % songs.length;
            loadSong(currentSong);
            audio.play();
            playBtn.textContent = '❚❚';
        }

        function prevSong() {
            currentSong = (currentSong - 1 + songs.length) % songs.length;
            loadSong(currentSong);
            audio.play();
            playBtn.textContent = '❚❚';
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) progress.value = (audio.currentTime / audio.duration) * 100;
        });

        progress.addEventListener('input', () => {
            audio.currentTime = (progress.value / 100) * audio.duration;
        });

        audio.addEventListener('ended', nextSong);

        // Playlist
        const playlistDiv = document.getElementById('playlist');
        songs.forEach((song, i) => {
            const div = document.createElement('div');
            div.textContent = song.title;
            div.onclick = () => {
                currentSong = i;
                loadSong(i);
                audio.play();
                playBtn.textContent = '❚❚';
            };
            playlistDiv.appendChild(div);
        });

        loadSong(0);

        // Rotating Facts
        const fiveThings = [
            "I love posters and money",
            "I want to be one of the greats - Andrew Nieman",
            "Trying to get better at digital art",
            "Jeff Buckley I love Jeff Buckley Omg Jeff Buckley Where?!",
            "i fw things"
        ];

        let currentThing = 0;
        const rotator = document.getElementById('rotating-text');

        function changeThing() {
            rotator.style.opacity = 0;
            setTimeout(() => {
                currentThing = (currentThing + 1) % fiveThings.length;
                rotator.textContent = fiveThings[currentThing];
                rotator.style.opacity = 1;
            }, 600);
        }

        rotator.textContent = fiveThings[0];
        setInterval(changeThing, 5000);
    </script>
</body>
</html>
