<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>glitterglue</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    overflow:hidden;
    color:white;
}

/* rain bg */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.08) 0px,
            rgba(255,255,255,0.08) 2px,
            transparent 2px,
            transparent 12px
        );
    animation:rain 0.6s linear infinite;
    opacity:0.25;
}

@keyframes rain{
    from{transform:translateY(-20px);}
    to{transform:translateY(20px);}
}

/* glow orb bg like screenshot */
.glow{
    position:absolute;
    width:600px;
    height:600px;
    background:radial-gradient(circle, rgba(255,0,255,0.15), transparent 60%);
    filter:blur(40px);
}

/* main card */
.profile{
    width:360px;
    padding:20px;
    border-radius:20px;
    background:rgba(15,15,15,0.85);
    border:1px solid #222;
    backdrop-filter:blur(12px);
    box-shadow:0 0 25px rgba(255,0,255,0.08);
    position:relative;
    z-index:2;
    transition:0.3s;
}

.profile:hover{
    box-shadow:0 0 35px rgba(255,0,255,0.25);
    transform:translateY(-3px);
}

/* top profile */
.header{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:8px;
}

.pfp{
    width:70px;
    height:70px;
    border-radius:50%;
    border:2px solid #ff3df2;
    box-shadow:0 0 20px #ff00ff55;
    object-fit: cover;
}

.name{
    font-size:22px;
    font-weight:800;
    color:#ff3df2;
}

.tag{
    font-size:12px;
    color:#888;
}

.bio{
    font-size:13px;
    color:#bbb;
    margin-top:8px;
}

/* music box */
.music{
    margin-top:15px;
    display:flex;
    align-items:center;
    gap:10px;
    background:#111;
    padding:10px;
    border-radius:14px;
    border:1px solid #222;
}

.cover{
    width:45px;
    height:45px;
    border-radius:10px;
}

.song{
    flex:1;
}

.song-title{
    font-size:13px;
    font-weight:600;
}

.controls button{
    background:none;
    border:none;
    color:#ff00ff;
    cursor:pointer;
    font-size:14px;
}

#play-btn-mini{
    background:#ff00ff;
    color:white;
    width:28px;
    height:28px;
    border-radius:50%;
}

/* playlist */
.playlist{
    margin-top:10px;
    max-height:120px;
    overflow-y:auto;
}

.playlist div{
    padding:6px;
    font-size:12px;
    border-radius:8px;
    color:#aaa;
    cursor:pointer;
}

.playlist div:hover{
    background:#1a1a1a;
    color:#ff3df2;
}

/* icons row */
.icons{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:12px;
    font-size:18px;
    color:#ff00ff;
}

.icons span{
    cursor:pointer;
    transition:0.2s;
}

.icons span:hover{
    transform:scale(1.2);
    text-shadow:0 0 10px #ff00ff;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="profile">

    <div class="header">
        <img class="pfp" src="assets/glitterglueprofilepicture.jpg">
        <div class="name">glitterglue</div>
        <div class="tag">@glittersdeath</div>
        <div class="bio">learning C# • official music prodigy • Science and Tology Dev</div>
    </div>

    <div class="music">
        <img id="album-small" class="cover" src="assets/Big Poe.jpg">

        <div class="song">
            <div id="mini-title" class="song-title">Big POE</div>
        </div>

        <div class="controls">
            <button onclick="prevSong()">⫷</button>
            <button id="play-btn-mini" onclick="togglePlay()">▶</button>
            <button onclick="nextSong()">⫸</button>
        </div>
    </div>

    <div class="playlist" id="playlist"></div>
</div>

<audio id="audio" style="display:none;">
    <source src="assets/Big Poe.mp3">
</audio>

<script>
const songs=[
    {title:"Big Poe",file:"assets/Big Poe.mp3",cover:"assets/Big POe.jpg"},
    {title:"Billie Jean",file:"assets/Billie Jean.mp3",cover:"assets/Billie Jean.jpg"},
    {title:"Earrings",file:"assets/Earrings.mp3",cover:"assets/Earrings.jpg"},
    {title:"Im Bo Yo",file:"assets/Im Bo Yo.mp3",cover:"assets/Im Bo Yo.jpg"},
    {title:"Last Goodbye",file:"assets/Last Goodbye.mp3",cover:"assets/grace.jpg"},
    {title:"Lover You Should've Come Over",file:"assets/Lover, You Should've come over.mp3",cover:"assets/grace.jpg"},
    {title:"Demo 1",file:"assets/demo1.mp3",cover:"assets/freaky.png"},
    {title:"SPEEDRUN GUYS!11!! (Running In Halls Simulator Original Soundtrack) (feat. TopZVR Tunes)",file:"assets/fucking hell this is a fire beat.mp3",cover:"assets/goon goon goon saqueef.png"},
    {title:"Anime Thighs",file:"assets/Anime Thighs.mp3",cover:"assets/anime thighs.jpg"},
    {title:"Where'd All The Time Go",file:"assets/Where'd All The Time Go.mp3",cover:"assets/where'd all the time go.jpg"},
    {title:"Cheat Codes For Hoes",file:"assets/Cheat Codes For Hoes.mp3",cover:"assets/cheat codes for hoes.jpg"},
    {title:"Charlies Inferno (Excuse Me Sir)",file:"assets/charlies inferno.mp3",cover:"assets/charlies inferno.jpg"}
];

let currentSong=0;
const audio=document.getElementById("audio");
const playBtn=document.getElementById("play-btn-mini");
const album=document.getElementById("album-small");
const title=document.getElementById("mini-title");

function load(i){
    audio.src=songs[i].file;
    album.src=songs[i].cover;
    title.textContent=songs[i].title;
}

function togglePlay(){
    if(audio.paused){
        audio.play();
        playBtn.textContent="❚❚";
    }else{
        audio.pause();
        playBtn.textContent="▶";
    }
}

function nextSong(){
    currentSong=(currentSong+1)%songs.length;
    load(currentSong);
    audio.play();
    playBtn.textContent="❚❚";
}

function prevSong(){
    currentSong=(currentSong-1+songs.length)%songs.length;
    load(currentSong);
    audio.play();
    playBtn.textContent="❚❚";
}

const list=document.getElementById("playlist");

songs.forEach((s,i)=>{
    const d=document.createElement("div");
    d.textContent=s.title;
    d.onclick=()=>{
        currentSong=i;
        load(i);
        audio.play();
        playBtn.textContent="❚❚";
    };
    list.appendChild(d);
});

load(0);
</script>

</body>
</html>
