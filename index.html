<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>glitterglue | bio</title>
    <style>
        /* Base Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Deep midnight purple gradient */
            background: radial-gradient(circle at center, #140724 0%, #030107 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Glassmorphism Profile Container */
        .card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        /* Profile Picture Styling */
        .pfp-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .pfp {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #ffffff; /* White background to pop the black and white drawing */
            border: 2px solid #a855f7; /* Purple glow accent */
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        /* Profile Tags */
        .name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .meta-tags {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .tag {
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.25);
            color: #d8b4fe;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Bio Box Items */
        .bio-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: left;
        }

        .bio-line {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 14px;
            font-size: 13.5px;
            line-height: 1.5;
            color: #e4e4e7;
            transition: transform 0.2s, border-color 0.2s;
        }

        /* Interactive Hover Layout */
        .bio-line:hover {
            transform: scale(1.02);
            border-color: rgba(168, 85, 247, 0.4);
            background: rgba(168, 85, 247, 0.02);
        }

        .highlight {
            color: #a855f7;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="pfp-wrapper">
            <!-- Embedded image file -->
            <img class="pfp" src="https://postimg.co" alt="glitterglue profile">
        </div>
        
        <div class="name">glitterglue</div>
        
        <div class="meta-tags">
            <span class="tag">he/him</span>
            <span class="tag">Portsmouth, UK</span>
        </div>

        <div class="bio-box">
            <div class="bio-line">
                🎵 I love <span class="highlight">drums</span> sm drums where?!
            </div>
            <div class="bio-line">
                🎨 I draw sometimes
            </div>
            <div class="bio-line">
                📌 If you found this via a post it note then hi hello your <span class="highlight">very local</span>
            </div>
        </div>
    </div>

</body>
</html>
