<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>glitterglue.fun</title>

<link rel="icon" href="https://images.rawpixel.com/image_png_800/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDI0LTA0L3JtMTgyMi1ib251cy0wOTZfMS5wbmc.png">

<style>
@import url('https://googleapis.com');

body {
  margin: 0;
  font-family: 'Comic Neue', Arial, sans-serif;
  overflow: hidden;
  color: #ff00ff;
  cursor: url('https://cursors-4u.net'), auto;
}

/* background */
.bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
  filter: contrast(150%) hue-rotate(45deg);
}

body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.15) 0px,
    rgba(0, 0, 0, 0.15) 1px,
    transparent 1px,
    transparent 2px
  );
  z-index: -1;
  pointer-events: none;
}

/* card */
.card {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 320px;
  padding: 20px;
  text-align: center;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(5px);
  border: 4px ridge #00ffff;
  border-radius: 0;
  box-shadow: 10px 10px 0px #ff00ff;
}

/* avatar */
.avatar {
  width: 110px;
  height: 110px;
  border-radius: 0;
  border: 3px solid #00ffff;
  outline: 3px solid #ff00ff;
}

/* spotify embed */
.spotify-player {
  margin-top: 15px;
  border: 2px dashed #ff00ff;
  overflow: hidden;
}

/* icons */
.icons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 15px;
}
.icons img {
  width: 40px;
  height: 40px;
  filter: drop-shadow(3px 3px 0px #00ffff);
  transition: 0.1s;
}
.icons img:hover {
  transform: rotate(15deg) scale(1.5);
}

/* views */
.views {
  margin-top: 10px;
  font-family: 'Courier New', Courier, monospace;
  background: #000;
  color: #0f0;
  padding: 2px;
  display: inline-block;
}

/* last updated */
#lastUpdated {
  position: fixed;
  bottom: 10px;
  right: 15px;
  font-size: 14px;
  color: #ffff00;
  background: #000;
  text-transform: uppercase;
}

/* ✨ mystery additions ✨ */
.blink {
  animation: blinker 0.6s linear infinite;
}
@keyframes blinker {
  50% { opacity: 0; }
}

.trail-box {
  position: absolute;
  width: 20px;
  height: 20px;
  background-image: url('https://ibb.co');
  background-size: contain;
  pointer-events: none;
  z-index: 9999;
}

marquee {
  position: fixed;
  top: 0;
  background: #ff00ff;
  color: white;
  font-weight: bold;
}
</style>
</head>

<body>

<marquee scrollamount="10">WELCOME TO MY WORLD -- Xx_glitterglue_xX -- MUSIC IS LIFE -- ☠️☠️☠️</marquee>

<img class="bg" src="https://i.pinimg.com/736x/f5/09/99/f50999905406cd8a17d5c46dfd9a9243.jpg">

<div class="card">
  <img class="avatar" src="https://i.pinimg.com/736x/d9/c9/50/d9c95014054055c012894d3c80cf75c1.jpg">

  <h1 class="blink">glitterglue</h1>
  <p style="color: #00ffff;">@glittersdeath</p>

  <div class="views">Hits: <span id="viewCount">...</span></div>

  <p>Studying music at Uni of Leeds</p>
  <p>~ 🥁 drums are my passion 🥁 ~</p>

  <div class="spotify-player">
    <iframe 
      src="https://open.spotify.com/embed/playlist/6vyFB24xfEsWqNZ1Aw3c47"
      width="100%" 
      height="152" 
      frameborder="0" 
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </div>

  <div class="icons">
    <a href="https://www.youtube.com/@glittersdeath"><img src="https://ibb.co"></a>
    <a href="https://open.spotify.com"><img src="https://ibb.co"></a>
    <a href="https://www.roblox.com"><img src="https://ibb.co"></a>
  </div>
</div>

<div id="lastUpdated"></div>

<script>
/* 🧊 sparkly trail */
document.addEventListener("mousemove", (e) => {
  const star = document.createElement("div");
  star.className = "trail-box";
  star.style.left = e.pageX + "px";
  star.style.top = e.pageY + "px";
  document.body.appendChild(star);

  setTimeout(() => {
    star.style.opacity = "0";
    star.style.transform = "translateY(20px) rotate(180deg)";
  }, 100);
  setTimeout(() => star.remove(), 500);
});

/* 👀 views */
document.getElementById("viewCount").innerText = Math.floor(Math.random() * 999999);

/* 🕒 last updated */
document.getElementById("lastUpdated").innerText = "L4ST UPD4T3D: " + new Date().toLocaleDateString();
</script>

</body>
</html>
