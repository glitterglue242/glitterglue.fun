<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">...</title>
    <!-- Icons Library -->
    <script src="https://unpkg.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #080808; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            overflow: hidden;
            color: white;
        }

        /* Glassmorphism Container */
        .card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 45px 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .pfp { 
            width: 100px; height: 100px; border-radius: 50%; 
            margin-bottom: 20px; border: 2px solid rgba(255,255,255,0.1);
            object-fit: cover;
        }

        .pronouns { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.4; display: block; margin-bottom: 8px; }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }

        .bio-container { height: 20px; margin-bottom: 10px; }
        #typewriter {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #ccc;
        }

        .location { font-size: 13px; opacity: 0.5; margin-bottom: 35px; display: block; }

        /* Minimal Social Icons Row */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 35px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 25px;
        }

        .icon-link {
            color: white;
            opacity: 0.4;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-link:hover {
            opacity: 1;
            transform: translateY(-4px);
            color: #fff;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Profile Picture -->
        <img src="https://discordapp.com" class="pfp" alt="Avatar">
        
        <span class="pronouns">he/him</span>
        <h1>@glittersdeath</h1>
        
        <!-- Typewriter Bio -->
        <div class="bio-container">
            <span id="typewriter"></span>
        </div>
        
        <span class="location">Studying at Leeds Conservatory</span>
        
        <!-- Social Icons Only -->
        <div class="social-icons">
            <a href="https://roblox.com" target="_blank" class="icon-link" title="Roblox">
                <i data-lucide="gamepad-2"></i>
            </a>
            <a href="https://youtube.com" target="_blank" class="icon-link" title="YouTube">
                <i data-lucide="youtube"></i>
            </a>
            <a href="https://spotify.com" target="_blank" class="icon-link" title="Spotify">
                <i data-lucide="music"></i>
            </a>
        </div>
    </div>

    <script>
        const bioText = "drums are my honest passion";
        const titleText = "Link in Bio";
        let bioIndex = 0;
        let titleIndex = 0;
        const speed = 100;

        // Typewriter for Browser Title
        function typeTitle() {
            if (titleIndex < titleText.length) {
                document.title = titleText.substring(0, titleIndex + 1);
                titleIndex++;
                setTimeout(typeTitle, speed);
            } else {
                typeBio(); // Start bio once title is done
            }
        }

        // Typewriter for Bio Section
        function typeBio() {
            if (bioIndex < bioText.length) {
                document.getElementById("typewriter").innerHTML += bioText.charAt(bioIndex);
                bioIndex++;
                setTimeout(typeBio, speed);
            }
        }

        // Initialize Everything
        window.onload = () => {
            typeTitle();
            lucide.createIcons(); // Load the social logos
        };
    </script>

</body>
</html>
