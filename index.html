<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>glitterglue.fun</title>

<link rel="icon" href="https://images.rawpixel.com/image_png_800/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDI0LTA0L3JtMTgyMi1ib251cy0wOTZfMS5wbmc.png">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  overflow: hidden;
  color: white;
}

/* 🎞️ REAL background (fixed) */
.bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

/* overlay */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.45);
  z-index: -1;
}

/* 📦 card */
.card {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 320px;
  padding: 20px;
  text-align: center;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border-radius: 15px;
}

/* avatar */
.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
}

/* play button */
.play-button {
  width: 60px;
  height: 60px;
  cursor: pointer;
  border-radius: 12px;
  transition: 0.2s;
}
.play-button:hover {
  transform: scale(1.15);
}

/* icons */
.icons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 15px;
}
.icons img {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  transition: 0.2s;
}
.icons img:hover {
  transform: scale(1.2);
}

/* trail */
.trail-box {
  position: absolute;
  width: 10px;
  height: 10px;
  background: white;
  border-radius: 2px;
  pointer-events: none;
  opacity: 0.8;
  transform: translate(-50%, -50%);
  transition: 0.2s;
}

/* views */
.views {
  margin-top: 10px;
  opacity: 0.8;
}

/* 🕒 last updated (REAL, static) */
#lastUpdated {
  position: fixed;
  bottom: 10px;
  right: 15px;
  font-size: 12px;
  opacity: 0.75;
  text-shadow: 0 0 6px rgba(255,255,255,0.5);
}
</style>
</head>

<body>

<!-- ✅ FIXED background -->
<img class="bg" src="https://i.pinimg.com/originals/66/ab/cd/66abcd769e19419d8221e9fb6dde0494.gif">

<div class="card">

  <img class="avatar" src="https://i.pinimg.com/736x/4d/c3/27/4dc32773bf3f17b97a04eaf2c071b5e4.jpg">

  <h1>glitterglue</h1>
  <p>@glittersdeath</p>

  <div class="views">👀 Live Views: <span id="viewCount">...</span></div>

  <p>studying music at leeds university</p>

  <!-- 🎧 player -->
  <img id="playBtn"
    class="play-button"
    src="https://i.pinimg.com/736x/63/19/86/6319864fd9988a4b08ef57c8cdf6b0b9.jpg">

  <audio id="audio" src="caravan.mp3"></audio>

  <!-- icons -->
  <div class="icons">
    <a href="https://www.youtube.com/@glittersdeath"><img src="https://i.pinimg.com/736x/b0/55/81/b05581a725d2dcf8cd26072d8210d433.jpg"></a>
    <a href="https://open.spotify.com"><img src="https://i.pinimg.com/736x/da/a7/5e/daa75e31fc19e574a2360123db08258a.jpg"></a>
    <a href="https://www.roblox.com"><img src="https://i.pinimg.com/736x/8c/5c/ad/8c5cad9f00b6babd03b9593f2a482b1e.jpg"></a>
  </div>

</div>

<div id="lastUpdated"></div>

<script>
const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");

/* 🎵 play toggle */
playBtn.onclick = () => {
  if (audio.paused) {
    audio.play();
    playBtn.style.transform = "scale(1.1)";
  } else {
    audio.pause();
    playBtn.style.transform = "scale(1)";
  }
};

/* 🧊 trail (behind cursor) */
let lastX = 0;
let lastY = 0;

document.addEventListener("mousemove", (e) => {
  const dx = e.pageX - lastX;
  const dy = e.pageY - lastY;

  lastX = e.pageX;
  lastY = e.pageY;

  const cube = document.createElement("div");
  cube.className = "trail-box";

  cube.style.left = (e.pageX - dx * 0.6) + "px";
  cube.style.top = (e.pageY - dy * 0.6) + "px";

  document.body.appendChild(cube);

  setTimeout(() => {
    cube.style.opacity = "0";
    cube.style.transform = "scale(0.3)";
  }, 40);

  setTimeout(() => cube.remove(), 300);
});

/* 👀 views */
fetch("https://api.countapi.xyz/hit/glitterglue/profile")
.then(r => r.json())
.then(d => document.getElementById("viewCount").innerText = d.value)
.catch(() => document.getElementById("viewCount").innerText = "0");

/* 🕒 REAL LAST UPDATED (NOT LIVE CLOCK) */
const buildTime = new Date(document.lastModified);

const formatted = buildTime.toLocaleString([], {
  hour: '2-digit',
  minute: '2-digit',
  day: '2-digit',
  month: '2-digit',
  year: 'numeric'
});

document.getElementById("lastUpdated").innerText =
  "🕒 Updated " + formatted;
</script>

</body>
</html>
