<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>glitterglue</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #1c1829;
            width: 100%;
            max-width: 360px;
            border-radius: 28px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .pfp {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid #a855f7;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.7);
            margin: 0 auto 14px;
        }
        .name {
            font-size: 26px;
            font-weight: 700;
            color: #c084fc;
            margin-bottom: 4px;
        }
        .handle {
            color: #b4a3d8;
            margin-bottom: 20px;
        }
        .bio {
            color: #d1c4ff;
            font-size: 14.5px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .now-playing {
            background: #161320;
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .album-art {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
        }
        .song-details {
            flex: 1;
            text-align: left;
        }
        .song-name {
            font-weight: 600;
            font-size: 15px;
        }
        .now-text {
            font-size: 12.5px;
            color: #a1a1aa;
        }
        .player-controls button {
            background: none;
            border: none;
            color: #c4b5fd;
            font-size: 24px;
            margin-left: 8px;
        }
        #play-main {
            background: #a855f7;
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 18px;
        }

        .song-list {
            background: #161320;
            border-radius: 14px;
            padding: 8px 0;
            margin-bottom: 16px;
        }
        .song-list div {
            padding: 10px 16px;
            text-align: left;
            cursor: pointer;
        }
        .song-list div:hover {
            background: #2a2540;
        }

        .fact {
            background: #161320;
            border-radius: 14px;
            padding: 16px;
            color: #c4b5fd;
            font-size: 14.5px;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="pfp" src="https://kappa.lol/q3cOI9" alt="pfp">

        <div class="name">glitterglue</div>
        <div class="handle">@glitterglue.fun</div>
        
        <div class="bio">
            I love drums sm • I draw sometimes • Portsmouth local
        </div>

        <!-- Mini Player -->
        <div class="now-playing">
            <img id="album-art" class="album-art" src="assets/Big Poe.jpg">
            <div class="song-details">
                <div id="current-song" class="song-name">Big POE</div>
                <div class="now-text">Now Playing</div>
            </div>
            <div class="player-controls">
                <button onclick="prevSong()">⫻</button>
                <button id="play-main" onclick="togglePlay()">▶</button>
                <button onclick="nextSong()">⫻</button>
            </div>
        </div>

        <!-- Playlist -->
        <div class="song-list" id="playlist"></div>

        <!-- Rotating Fact -->
        <div class="fact" id="rotating-text"></div>
    </div>

    <audio id="audio" style="display:none"></audio>

    <script>
        const songs = [
            { title: "Big POE", file: "assets/Big Poe.mp3", cover: "assets/Big POe.jpg" },
            { title: "Billie Jean", file: "assets/Billie Jean.mp3", cover: "assets/Billie Jean.jpg" },
            { title: "Earrings", file: "assets/Earrings.mp3", cover: "assets/Earrings.jpg" },
            { title: "Im Bo Yo", file: "assets/Im Bo Yo.mp3", cover: "assets/Im Bo Yo.jpg" },
            { title: "Last Goodbye", file: "assets/Last Goodbye.mp3", cover: "assets/grace.jpg" },
            { title: "Lover, You Should've Come Over", file: "assets/Lover, You Should've come over.mp3", cover: "assets/grace.jpg" },
            { title: "Demo 1", file: "assets/demo1.mp3", cover: "assets/freaky.png" }   // ← New song added
        ];

        let currentSong = 0;
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play-main');
        const currentSongEl = document.getElementById('current-song');
        const albumArt = document.getElementById('album-art');

        function loadSong(index) {
            audio.src = songs[index].file;
            albumArt.src = songs[index].cover;
            currentSongEl.textContent = songs[index].title;
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.textContent = '❚❚';
            } else {
                audio.pause();
                playBtn.textContent = '▶';
            }
        }

        function nextSong() {
            currentSong = (currentSong + 1) % songs.length;
            loadSong(currentSong);
            audio.play();
            playBtn.textContent = '❚❚';
        }

        function prevSong() {
            currentSong = (currentSong - 1 + songs.length) % songs.length;
            loadSong(currentSong);
            audio.play();
            playBtn.textContent = '❚❚';
        }

        audio.addEventListener('ended', nextSong);

        // Build Playlist
        const playlistEl = document.getElementById('playlist');
        songs.forEach((song, i) => {
            const item = document.createElement('div');
            item.textContent = song.title;
            item.onclick = () => {
                currentSong = i;
                loadSong(i);
                audio.play();
                playBtn.textContent = '❚❚';
            };
            playlistEl.appendChild(item);
        });

        loadSong(0);

        // Rotating Facts
        const facts = [
            "I love posters and money",
            "I want to be one of the greats - Andrew Nieman",
            "Trying to get better at digital art",
            "Jeff Buckley I love Jeff Buckley Omg Jeff Buckley Where?!",
            "i fw things"
        ];

        let factIndex = 0;
        const factEl = document.getElementById('rotating-text');

        function rotateFact() {
            factEl.style.opacity = 0;
            setTimeout(() => {
                factIndex = (factIndex + 1) % facts.length;
                factEl.textContent = facts[factIndex];
                factEl.style.opacity = 1;
            }, 600);
        }

        factEl.textContent = facts[0];
        setInterval(rotateFact, 5000);
    </script>
</body>
</html>
