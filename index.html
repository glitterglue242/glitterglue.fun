<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>glitterglue | bio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #140724 0%, #030107 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        .pfp {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }
        .name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }
        .meta-tags {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }
        .tag {
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.25);
            color: #d8b4fe;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .bio-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: left;
            margin-bottom: 25px;
        }
        .bio-line {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 14px;
            font-size: 13.5px;
            line-height: 1.5;
            color: #e4e4e7;
        }
        .highlight {
            color: #a855f7;
            font-weight: 600;
        }

        /* Music Player */
        .music-player {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .music-player h3 {
            color: #c084fc;
            margin-bottom: 15px;
            font-size: 15px;
            letter-spacing: 1px;
        }
        #album-art {
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
            width: 210px;
            height: 210px;
            object-fit: cover;
        }

        /* Five Things Rotator */
        .rotating-things {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 16px;
            padding: 20px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14.5px;
            color: #c4b5fd;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="pfp-wrapper">
            <img class="pfp" src="https://kappa.lol/q3cOI9" alt="glitterglue profile">
        </div>
       
        <div class="name">glitterglue</div>
       
        <div class="meta-tags">
            <span class="tag">he/him</span>
            <span class="tag">Portsmouth, UK</span>
        </div>

        <div class="bio-box">
            <div class="bio-line">🎵 I love <span class="highlight">drums</span> sm drums where?!</div>
            <div class="bio-line">🎨 I draw sometimes</div>
            <div class="bio-line">📌 If you found this via a post it note then hi hello your <span class="highlight">very local</span></div>
        </div>

        <!-- MUSIC PLAYER -->
        <div class="music-player">
            <h3>♪ NOW PLAYING</h3>
            
            <img id="album-art" src="assets/Big Poe.jpg" alt="album art">
            
            <p id="song-title" style="font-size: 16px; margin: 12px 0;">Big POE</p>
            
            <audio id="audio" style="display: none;">
                <source src="assets/Big Poe.mp3" type="audio/mpeg">
            </audio>

            <div style="display: flex; justify-content: center; align-items: center; gap: 20px; margin: 15px 0;">
                <button onclick="prevSong()" style="background: rgba(255,255,255,0.1); color: #c084fc; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 20px;">⫻</button>
                <button id="play-btn" onclick="togglePlay()" style="background: #a855f7; color: white; border: none; width: 72px; height: 72px; border-radius: 50%; font-size: 32px; box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);">▶</button>
                <button onclick="nextSong()" style="background: rgba(255,255,255,0.1); color: #c084fc; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 20px;">⫻</button>
            </div>

            <input type="range" id="progress" value="0" max="100" style="width: 100%; accent-color: #c084fc;">

            <div id="playlist" style="margin-top: 20px; text-align: left; font-size: 13.5px; max-height: 190px; overflow-y: auto;"></div>
        </div>

        <!-- FIVE THINGS - Auto Changes Every 5 Seconds -->
        <div class="rotating-things">
            <div id="rotating-text"></div>
        </div>
    </div>

    <script>
        // === MUSIC PLAYER CODE ===
        const songs = [
            { title: "Big POE",          file: "assets/Big Poe.mp3",      cover: "assets/Big POe.jpg" },
            { title: "Billie Jean",      file: "assets/Billie Jean.mp3",  cover: "assets/Billie Jean.jpg" },
            { title: "Earrings",         file: "assets/Earrings.mp3",     cover: "assets/Earrings.jpg" },
            { title: "Im Bo Yo",         file: "assets/Im Bo Yo.mp3",     cover: "assets/Im Bo Yo.jpg" },
            { title: "Last Goodbye",     file: "assets/Last Goodbye.mp3", cover: "assets/grace.jpg" },
            { title: "Lover, You Should've Come Over", file: "assets/Lover, You Should've come over.mp3", cover: "assets/grace.jpg" }
        ];

        let currentSong = 0;
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play-btn');
        const albumArt = document.getElementById('album-art');
        const songTitle = document.getElementById('song-title');
        const progress = document.getElementById('progress');

        function loadSong(index) {
            audio.src = songs[index].file;
            albumArt.src = songs[index].cover;
            songTitle.textContent = songs[index].title;
            progress.value = 0;
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.textContent = '❚❚';
            } else {
                audio.pause();
                playBtn.textContent = '▶';
            }
        }

        function nextSong() {
            currentSong = (currentSong + 1) % songs.length;
            loadSong(currentSong);
            audio.play();
            playBtn.textContent = '❚❚';
        }

        function prevSong() {
            currentSong = (currentSong - 1 + songs.length) % songs.length;
            loadSong(currentSong);
            audio.play();
            playBtn.textContent = '❚❚';
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) progress.value = (audio.currentTime / audio.duration) * 100;
        });

        progress.addEventListener('input', () => {
            audio.currentTime = (progress.value / 100) * audio.duration;
        });

        audio.addEventListener('ended', nextSong);

        // Build playlist
        const playlistDiv = document.getElementById('playlist');
        songs.forEach((song, i) => {
            const div = document.createElement('div');
            div.style = "padding: 9px 12px; cursor: pointer; border-radius: 8px; transition: 0.2s;";
            div.textContent = song.title;
            div.onmouseover = () => div.style.background = "rgba(168, 85, 247, 0.15)";
            div.onmouseout = () => div.style.background = "";
            div.onclick = () => {
                currentSong = i;
                loadSong(i);
                audio.play();
                playBtn.textContent = '❚❚';
            };
            playlistDiv.appendChild(div);
        });

        loadSong(0);

        // === FIVE THINGS ROTATOR ===
        const fiveThings = [
            "Currently obsessed with learning new drum patterns",
            "Always down for a late night walk by the sea",
            "Trying to get better at digital art",
            "Love finding weird music on Bandcamp",
            "Local to Portsmouth — say hi if you see me 👀"
        ];

        let currentThing = 0;
        const rotator = document.getElementById('rotating-text');

        function changeThing() {
            rotator.style.opacity = 0;

            setTimeout(() => {
                currentThing = (currentThing + 1) % fiveThings.length;
                rotator.textContent = fiveThings[currentThing];
                rotator.style.opacity = 1;
            }, 600);
        }

        // Start rotator
        rotator.textContent = fiveThings[0];
        setInterval(changeThing, 5000);   // Change every 5 seconds
    </script>
</body>
</html>
