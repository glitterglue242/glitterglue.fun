<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Rain background -->
<div class="rain"></div>

<!-- Main Card -->
<div class="card">
  <img src="https://via.placeholder.com/100" class="avatar">

  <h1>glitterglue</h1>
  <p class="username">@glittersdeath</p>

  <p class="bio">i like jazz, indie and rock</p>

  <div class="tags">
    <span>music prodigy trust</span>
    <span>learning drums atm</span>
  </div>

  <!-- Music Player -->
  <div class="player">
    <p>demo #6 (it's nice to know you)</p>
    <button onclick="togglePlay()">▶ Play / Pause</button>
    <audio id="audio" src="Caravan.WMP11.AssocFile.MP3"></audio>
  </div>

  <!-- Icons -->
  <div class="icons">
    <span>🎮</span>
    <span>💻</span>
    <span>🕶️</span>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
