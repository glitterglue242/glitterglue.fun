<!DOCTYPE html>
<html>
<head>
    <title>ImHyper</title>
    <style>
    body {
        background-color: #121212; /* Dark background */
        color: #ffffff; /* White text */
        font-family: 'Courier New', Courier, monospace; /* Clean typewriter font */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    h1, h2 {
        white-space: nowrap;
        overflow: hidden;
        border-right: 3px solid #ff4500; /* Neon orange cursor */
    }

    h1 {
        font-size: 2.5rem;
        width: 47ch; /* Exact character count for H1 */
        animation: 
            typingH1 4s steps(47) forwards,
            blink 0.5s step-end infinite alternate;
    }

    h2 {
        font-size: 1.5rem;
        width: 23ch; /* Exact character count for H2 */
        opacity: 0; /* Hidden until H1 finishes */
        animation: 
            typingH2 2s steps(23) forwards,
            blink 0.5s step-end infinite alternate;
        animation-delay: 4.5s; /* Starts after H1 finishes typing */
    }

    /* H1 Typing Animation */
    @keyframes typingH1 {
        from { width: 0; }
        to { border-right-color: transparent; } /* Hides cursor when done */
    }

    /* H2 Typing Animation */
    @keyframes typingH2 {
        from { width: 0; opacity: 1; }
        to { opacity: 1; }
    }

    /* Blinking Cursor Animation */
    @keyframes blink {
        50% { border-color: transparent; }
    }
    </style>
</head>
<body>

    <h1>This Website Is Currently undergoing Changes</h1>
    <h2>please check back later</h2>
    
</body>
</html>
