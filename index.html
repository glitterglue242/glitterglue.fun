<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>glitterglue</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  overflow: hidden;
  color: white;
}

/* 🎞️ background */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background: url("https://i.pinimg.com/originals/66/ab/cd/66abcd769e19419d8221e9fb6dde0494.gif");
  background-size: cover;
  background-position: center;
  z-index: -2;
}

body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.45);
  z-index: -1;
}

/* 📦 card */
.card {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 340px;
  padding: 20px;
  text-align: center;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border-radius: 15px;
}

/* 💿 avatar disc */
.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  transition: transform 0.3s linear;
}

.playing {
  animation: spin 4s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* 🎧 button */
.play-button {
  width: 60px;
  height: 60px;
  cursor: pointer;
  border-radius: 12px;
  transition: 0.2s;
}
.play-button:hover {
  transform: scale(1.15);
}

/* 🎚️ progress */
.progress-container {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 5px;
  margin-top: 10px;
  cursor: pointer;
}

.progress {
  height: 100%;
  width: 0%;
  background: white;
  border-radius: 5px;
}

/* ⏱ time */
.time {
  font-size: 12px;
  opacity: 0.8;
  margin-top: 5px;
}

/* 🔴 live */
.live {
  font-size: 12px;
  margin-top: 8px;
  opacity: 0.9;
}
.live span {
  color: red;
  animation: pulse 1s infinite;
}
@keyframes pulse {
  50% { opacity: 0.3; }
}

/* 🔗 icons */
.icons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 15px;
}
.icons img {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  transition: 0.2s;
}
.icons img:hover {
  transform: scale(1.2);
}

/* 🧊 cube trail */
.trail-box {
  position: absolute;
  width: 10px;
  height: 10px;
  background: white;
  border-radius: 2px;
  pointer-events: none;
  opacity: 0.8;
  transform: translate(-50%, -50%);
  transition: 0.2s;
}

/* 👀 views */
.views {
  font-size: 14px;
  opacity: 0.8;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="card">

  <img class="avatar" id="avatar"
    src="https://i.pinimg.com/736x/4d/c3/27/4dc32773bf3f17b97a04eaf2c071b5e4.jpg">

  <h1>glitterglue</h1>
  <p>@glittersdeath</p>

  <div class="views">👀 Live Views: <span id="viewCount">...</span></div>

  <div class="live">🔴 <span>LIVE</span> vibe</div>

  <p>studying music at leeds university</p>

  <!-- 🎧 player -->
  <img id="playBtn"
    class="play-button"
    src="https://i.pinimg.com/736x/63/19/86/6319864fd9988a4b08ef57c8cdf6b0b9.jpg"
    onclick="togglePlay()">

  <audio id="audio" src="caravan.mp3"></audio>

  <!-- progress -->
  <div class="progress-container" onclick="seek(event)">
    <div class="progress" id="progress"></div>
  </div>

  <div class="time">
    <span id="current">0:00</span> / <span id="duration">0:00</span>
  </div>

  <!-- icons -->
  <div class="icons">
    <a href="https://www.youtube.com/@glittersdeath"><img src="https://i.pinimg.com/736x/b0/55/81/b05581a725d2dcf8cd26072d8210d433.jpg"></a>
    <a href="https://www.instagram.com/glittersdeath/"><img src="https://i.pinimg.com/736x/dc/44/3f/dc443ffa6e921c949e48a7bae957108e.jpg"></a>
    <a href="https://www.roblox.com/users/685179066/profile"><img src="https://i.pinimg.com/736x/8c/5c/ad/8c5cad9f00b6babd03b9593f2a482b1e.jpg"></a>
  </div>

</div>

<script>
const audio = document.getElementById("audio");
const avatar = document.getElementById("avatar");
const progress = document.getElementById("progress");
const current = document.getElementById("current");
const duration = document.getElementById("duration");

function togglePlay(){
  if(audio.paused){
    audio.play();
    avatar.classList.add("playing");
  } else {
    audio.pause();
    avatar.classList.remove("playing");
  }
}

/* progress bar */
audio.addEventListener("timeupdate", () => {
  const percent = (audio.currentTime / audio.duration) * 100;
  progress.style.width = percent + "%";

  current.textContent = format(audio.currentTime);
});

audio.addEventListener("loadedmetadata", () => {
  duration.textContent = format(audio.duration);
});

function format(s){
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec < 10 ? "0" : ""}${sec}`;
}

function seek(e){
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percent * audio.duration;
}

/* cube trail */
document.addEventListener("mousemove", e => {
  const box = document.createElement("div");
  box.className = "trail-box";
  box.style.left = e.pageX + "px";
  box.style.top = e.pageY + "px";
  document.body.appendChild(box);

  setTimeout(() => {
    box.style.opacity = "0";
    box.style.transform = "scale(0.3)";
  }, 50);

  setTimeout(() => box.remove(), 300);
});

/* countapi */
fetch("https://api.countapi.xyz/hit/glitterglue/profile")
.then(r => r.json())
.then(d => document.getElementById("viewCount").innerText = d.value)
.catch(() => document.getElementById("viewCount").innerText = "0");
</script>

</body>
</html>
