<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImHyper - Music</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: "Courier New", Courier, monospace;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    .grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.22) 2px, transparent 2px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.22) 2px, transparent 2px);
      background-size: 50px 50px;
      background-position: -1000px -1000px;
      animation: gridMove 10s linear infinite;
      pointer-events: none;
    }
    @keyframes gridMove {
      0% { background-position: -1000px -1000px; }
      100% { background-position: 1000px 1000px; }
    }
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px 90px;
    }
    .logo {
      background-color: #ee1c25;
      color: #fff;
      font-family: "Futura", "Futura PT", "Trebuchet MS", Arial, sans-serif;
      font-weight: 800;
      font-style: oblique;
      font-size: 28px;
      letter-spacing: 1px;
      padding: 6px 14px;
      display: inline-block;
      margin-bottom: 18px;
    }
    .date {
      font-size: 14px;
      color: #fff;
      margin-bottom: 40px;
      letter-spacing: 0.5px;
    }
    .section-title {
      font-size: 15px;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: #fff;
      text-transform: uppercase;
      align-self: flex-start;
      max-width: 640px;
      width: 100%;
    }
    .section-note {
      font-size: 12px;
      color: #666;
      margin-bottom: 20px;
      align-self: flex-start;
      max-width: 640px;
      width: 100%;
    }
    .music-list {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 40px;
    }
    .item {
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 14px 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      text-decoration: none;
      color: #fff;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .item:hover {
      border-color: #ee1c25;
      background-color: rgba(238, 28, 37, 0.08);
    }
    .item img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .item-info {
      flex: 1;
      min-width: 0;
    }
    .item-name {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-meta {
      font-size: 12px;
      color: #888;
    }
    .loading, .error {
      font-size: 14px;
      color: #888;
      text-align: center;
      padding: 24px;
    }
    .error { color: #ee1c25; }
    .socials {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .socials a {
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      transition: background-color 0.15s;
      border-radius: 4px;
      padding: 4px;
    }
    .socials a:hover {
      background-color: #ee1c25;
    }
    .socials a svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    <div class="index.html">ImHyper</div>
    <div class="date" id="local-time">loading...</div>

    <div class="section-title">Music</div>
    <div class="section-note">Synced live from Spotify</div>

    <div class="music-list" id="music-list">
      <div class="loading">loading music...</div>
    </div>

    <div class="socials">
      <a href="https://open.spotify.com/artist/2WY33q3Ue97nIP7ne2SAjd" title="Spotify" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
      </a>
    </div>
  </div>

  <script>
    // ⬇️ PUT YOUR CLOUDFLARE WORKER URL HERE
    const WORKER_URL = "https://imhyper.brodybanster.workers.dev/";

    function updateLocalTime() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const year = now.getFullYear();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'pm' : 'am';
      hours = hours % 12 || 12;
      const hourStr = String(hours).padStart(2, '0');
      const tz = now.toLocaleTimeString('en-US', { timeZoneName: 'short' }).split(' ').pop();
      document.getElementById('local-time').textContent =
        `${month}/${day}/${year} ${hourStr}:${minutes}${ampm} ${tz}`;
    }
    updateLocalTime();
    setInterval(updateLocalTime, 30000);

    async function loadMusic() {
      const list = document.getElementById('music-list');
      try {
        const res = await fetch(WORKER_URL);
        if (!res.ok) throw new Error('Worker error');
        const data = await res.json();

        if (data.error) throw new Error(data.error);

        let html = '';

        // Top tracks first
        if (data.top_tracks && data.top_tracks.length) {
          data.top_tracks.forEach(track => {
            const img = track.album?.images?.[2]?.url || track.album?.images?.[0]?.url || '';
            html += `
              <a class="item" href="${track.external_urls.spotify}" target="_blank" rel="noopener">
                ${img ? `<img src="${img}" alt="">` : ''}
                <div class="item-info">
                  <div class="item-name">${track.name}</div>
                  <div class="item-meta">Top track · ${track.album?.name || ''}</div>
                </div>
              </a>`;
          });
        }

        // Albums / singles
        if (data.albums && data.albums.length) {
          data.albums.forEach(album => {
            const img = album.images?.[2]?.url || album.images?.[0]?.url || '';
            const type = album.album_type || 'release';
            html += `
              <a class="item" href="${album.external_urls.spotify}" target="_blank" rel="noopener">
                ${img ? `<img src="${img}" alt="">` : ''}
                <div class="item-info">
                  <div class="item-name">${album.name}</div>
                  <div class="item-meta">${type} · ${album.release_date || ''}</div>
                </div>
              </a>`;
          });
        }

        list.innerHTML = html || '<div class="loading">no music found</div>';
      } catch (err) {
        console.error(err);
        list.innerHTML = `<div class="error">failed to load music</div>`;
      }
    }

    loadMusic();
  </script>
</body>
</html>
