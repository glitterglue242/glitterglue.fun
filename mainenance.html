<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We'll Be Right Back - Under Maintenance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 550px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .icon {
            font-size: 50px;
            margin-bottom: 20px;
            display: inline-block;
            animation: gear-rotate 4s linear infinite;
        }
        @keyframes gear-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin-bottom: 15px;
        }
        p {
            font-size: 16px;
            color: #666666;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .badge {
            display: inline-block;
            background-color: #e1f5fe;
            color: #0288d1;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #999999;
            border-top: 1px solid #eeeeee;
            padding-top: 20px;
        }
        .footer a {
            color: #0288d1;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⚙️</div>
        <div class="badge">Scheduled Maintenance</div>
        <br><br>
        <h1>We'll Be Right Back!</h1>
        <p>Our website is temporarily down while we perform scheduled upgrades and system optimizations. We expect to be fully online shortly.</p>
        

</body>
</html>
