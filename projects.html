<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImHyper — Projects</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: "Courier New", Courier, monospace;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    .grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.22) 2px, transparent 2px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.22) 2px, transparent 2px);
      background-size: 50px 50px;
      background-position: -1000px -1000px;
      animation: gridMove 10s linear infinite;
      pointer-events: none;
    }
    @keyframes gridMove {
      0% { background-position: -1000px -1000px; }
      100% { background-position: 1000px 1000px; }
    }
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px 90px;
    }
    .logo {
      background-color: #ee1c25;
      color: #fff;
      font-family: "Futura", "Futura PT", "Trebuchet MS", Arial, sans-serif;
      font-weight: 800;
      font-style: oblique;
      font-size: 28px;
      letter-spacing: 1px;
      padding: 6px 14px;
      display: inline-block;
      text-decoration: none;
      margin-bottom: 18px;
    }
    .date {
      font-size: 14px;
      color: #fff;
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }
    .section-title {
      font-size: 15px;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: #fff;
      text-transform: uppercase;
      align-self: flex-start;
      max-width: 640px;
      width: 100%;
    }
    .section-note {
      font-size: 12px;
      color: #666;
      margin-bottom: 20px;
      align-self: flex-start;
      max-width: 640px;
      width: 100%;
    }
    .repos {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 40px;
    }
    .repo {
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 14px 16px;
      transition: border-color 0.15s, background-color 0.15s;
      text-decoration: none;
      color: #fff;
      display: block;
    }
    .repo:hover {
      border-color: #ee1c25;
      background-color: rgba(238, 28, 37, 0.08);
    }
    .repo-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 6px;
    }
    .repo-name {
      font-size: 15px;
      font-weight: bold;
      color: #fff;
    }
    .repo-badge {
      font-size: 11px;
      padding: 1px 6px;
      border: 1px solid #555;
      color: #aaa;
      white-space: nowrap;
    }
    .repo-badge.owned {
      border-color: #ee1c25;
      color: #ee1c25;
    }
    .repo-desc {
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 8px;
      color: #bbb;
    }
    .repo-meta {
      font-size: 12px;
      color: #777;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .loading, .error, .empty {
      font-size: 14px;
      color: #888;
      text-align: center;
      padding: 24px;
    }
    .error { color: #ee1c25; }
    .socials {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .socials a {
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      padding: 4px;
      transition: background-color 0.15s;
    }
    .socials a:hover { background-color: #ee1c25; }
    .socials a svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    <a href="imhyper.html" class="logo">ImHyper</a>
    <div class="date" id="local-time">loading...</div>

    <div class="section-title">Repos I own / contributed to</div>
    <div class="section-note">Pulled live from GitHub (public data only)</div>

    <div class="repos" id="repos">
      <div class="loading">loading repos...</div>
    </div>

    <div class="socials">
      <a href="https://www.youtube.com/@hyperisunknown" title="YouTube" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      </a>
      <a href="https://github.com/glitterglue242" title="GitHub" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>
      <a href="https://discord.gg/tFXkhNJB3j" title="Discord" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      </a>
    </div>
  </div>

  <script>
    const USERNAME = 'glitterglue242';
    const reposEl = document.getElementById('repos');

    function updateLocalTime() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const year = now.getFullYear();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'pm' : 'am';
      hours = hours % 12 || 12;
      const hourStr = String(hours).padStart(2, '0');
      const tz = now.toLocaleTimeString('en-US', { timeZoneName: 'short' }).split(' ').pop();
      document.getElementById('local-time').textContent =
        `${month}/${day}/${year} ${hourStr}:${minutes}${ampm} ${tz}`;
    }
    updateLocalTime();
    setInterval(updateLocalTime, 30000);

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', {
        year: 'numeric', month: 'short', day: 'numeric'
      });
    }

    function renderRepos(list) {
      if (!list.length) {
        reposEl.innerHTML = '<div class="empty">no public repos found</div>';
        return;
      }

      // Sort: owned first, then by updated
      list.sort((a, b) => {
        if (a.owned !== b.owned) return a.owned ? -1 : 1;
        return new Date(b.updated_at) - new Date(a.updated_at);
      });

      reposEl.innerHTML = list.map(repo => `
        <a class="repo" href="${repo.html_url}" target="_blank" rel="noopener">
          <div class="repo-top">
            <div class="repo-name">${repo.full_name || repo.name}</div>
            <div class="repo-badge ${repo.owned ? 'owned' : ''}">${repo.owned ? 'owned' : 'contributed'}</div>
          </div>
          <div class="repo-desc">${repo.description || 'no description'}</div>
          <div class="repo-meta">
            <span>${repo.language || '—'}</span>
            <span>★ ${repo.stargazers_count ?? 0}</span>
            <span>updated ${formatDate(repo.updated_at)}</span>
          </div>
        </a>
      `).join('');
    }

    async function loadRepos() {
      try {
        // 1. Owned public repos
        const ownedRes = await fetch(
          `https://api.github.com/users/${USERNAME}/repos?sort=updated&per_page=100`
        );
        if (!ownedRes.ok) throw new Error('owned repos failed');
        const owned = await ownedRes.json();

        const map = new Map();
        for (const r of owned) {
          map.set(r.full_name, {
            name: r.name,
            full_name: r.full_name,
            description: r.description,
            language: r.language,
            stargazers_count: r.stargazers_count,
            updated_at: r.updated_at,
            html_url: r.html_url,
            owned: true
          });
        }

        // 2. Repos contributed to (via commit search)
        // Note: search is rate-limited; we take first page only
        const searchRes = await fetch(
          `https://api.github.com/search/commits?q=author:${USERNAME}&per_page=100`,
          { headers: { Accept: 'application/vnd.github.cloak-preview+json' } }
        );

        if (searchRes.ok) {
          const searchData = await searchRes.json();
          for (const item of (searchData.items || [])) {
            const repo = item.repository;
            if (!repo || !repo.full_name) continue;
            if (map.has(repo.full_name)) continue; // already have it

            map.set(repo.full_name, {
              name: repo.name,
              full_name: repo.full_name,
              description: repo.description,
              language: null,
              stargazers_count: repo.stargazers_count ?? 0,
              updated_at: repo.updated_at || item.commit?.author?.date || new Date().toISOString(),
              html_url: repo.html_url,
              owned: false
            });
          }
        }

        // 3. Also check recent public events (catches some collab activity)
        try {
          const eventsRes = await fetch(
            `https://api.github.com/users/${USERNAME}/events/public?per_page=50`
          );
          if (eventsRes.ok) {
            const events = await eventsRes.json();
            for (const e of events) {
              const full = e.repo?.name;
              if (!full || map.has(full)) continue;
              map.set(full, {
                name: full.split('/')[1],
                full_name: full,
                description: null,
                language: null,
                stargazers_count: 0,
                updated_at: e.created_at,
                html_url: `https://github.com/${full}`,
                owned: false
              });
            }
          }
        } catch (_) { /* optional */ }

        renderRepos(Array.from(map.values()));
      } catch (err) {
        console.error(err);
        reposEl.innerHTML = '<div class="error">failed to load repos — try again later</div>';
      }
    }

    loadRepos();
  </script>
</body>
</html>
