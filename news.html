<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImHyper – News</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #fff;
      color: #000;
      font-family: "Courier New", Courier, monospace;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      line-height: 1.5;
    }
 
    .grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-image:
        linear-gradient(to right, rgba(0, 0, 0, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.08) 1px, transparent 1px);
      background-size: 50px 50px;
      background-position: -1000px -1000px;
      animation: gridMove 10s linear infinite;
      pointer-events: none;
    }
    @keyframes gridMove {
      0% {
        background-position: -1000px -1000px;
      }
      100% {
        background-position: 1000px 1000px;
      }
    }
    .header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 20px 30px;
    }
    .logo {
      background-color: #ee1c25;
      color: #fff;
      font-family: "Futura", "Futura PT", "Trebuchet MS", Arial, sans-serif;
      font-weight: 800;
      font-style: oblique;
      font-size: 28px;
      letter-spacing: 1px;
      padding: 6px 14px;
      display: inline-block;
      text-decoration: none;
    }
    .date-time {
      font-size: 14px;
      margin-top: 14px;
      letter-spacing: 0.5px;
      color: #000;
    }
    .content {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 40px 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: start;
    }
    .image-col {
      position: relative;
    }
    .image-col img {
      width: 100%;
      height: auto;
      display: block;
      background: #f0f0f0;
    }
    .pagination {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .pagination a {
      color: #000;
      text-decoration: none;
      padding: 0 6px;
    }
    .pagination a:hover {
      background-color: #ee1c25;
      color: #fff;
    }
    .text-col {
      font-size: 14px;
      letter-spacing: 0.3px;
      color: #000;
    }
    .text-col .post-date {
      margin-bottom: 6px;
    }
    .text-col .title {
      font-weight: bold;
      margin-bottom: 18px;
    }
    .text-col p {
      margin-bottom: 16px;
    }
    .text-col .archive {
      margin-top: 30px;
      display: inline-block;
      color: #000;
      text-decoration: underline;
    }
    .text-col .archive:hover {
      background-color: #ee1c25;
      color: #fff;
      text-decoration: none;
    }
    @media (max-width: 800px) {
      .content {
        grid-template-columns: 1fr;
        gap: 30px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <header class="header">
    <a href="index.html" class="logo">ImHyper</a>
    <div class="date-time" id="local-time">loading...</div>
  </header>

  <main class="content">
    <!-- LEFT: Image + pagination -->
    <div class="image-col">
    <img src="https://kappa.lol/44JDlc" alt="souloxfr.dev">
      <div class="pagination">
        <a href="#">&larr;</a>
        <span>1 of 1</span>
        <a href="#">&rarr;</a>
      </div>
    </div>

    <!-- RIGHT: Text content -->
    <div class="text-col">
      <div class="post-date">08/09/2026</div>
      <div class="title">ImHyper / Threshold First Contact</div>
      <p>
        No News Scoop Currently!
      </p>
      <p>
        
      </p>
      <p>
        
      </p>
      <p>
        
      </p>
      <a href="#" class="archive">archive</a>
    </div>
  </main>

  <script>
    function updateLocalTime() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const year = now.getFullYear();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'pm' : 'am';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const hourStr = String(hours).padStart(2, '0');
      const tz = now.toLocaleTimeString('en-US', { timeZoneName: 'short' }).split(' ').pop();
      document.getElementById('local-time').textContent = `${month}/${day}/${year} ${hourStr}:${minutes}${ampm} ${tz}`;
    }
    updateLocalTime();
    setInterval(updateLocalTime, 30000);
  </script>
</body>
</html>
