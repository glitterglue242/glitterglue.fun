<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Hyper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}
html{
scroll-behavior:smooth;
}
body{
background:#0d0d0d;
color:white;
overflow-x:hidden;
min-height:100vh;
}
.grid{
position:fixed;
inset:0;
z-index:-20;
background-image:
linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
background-size:30px 30px;
animation:gridMove 5s linear infinite;
}
@keyframes gridMove{
from{background-position:0 0;}
to{background-position:30px 30px;}
}

/* Navbar */
nav{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
width:90%;
max-width:1000px;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 30px;
background:rgba(15,15,15,.75);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(16px);
border-radius:18px;
z-index:999;
}
.logo{
font-size:28px;
font-weight:800;
letter-spacing:1px;
color:white;
}
.logo span{
color:#00d9ff;
}
nav ul{
display:flex;
gap:35px;
list-style:none;
}
nav a{
text-decoration:none;
color:white;
font-weight:600;
transition:.3s;
}
nav a:hover{
color:#00d9ff;
}

/* Main Content */
.contact-section{
padding:180px 10% 120px;
max-width:800px;
margin:0 auto;
text-align:center;
}
.contact-card{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
padding:50px 40px;
backdrop-filter:blur(12px);
transition:.35s;
}
.contact-card:hover{
transform:translateY(-8px);
border-color:#00d9ff;
box-shadow:0 0 30px rgba(0,217,255,.15);
}
.small-title{
color:#00d9ff;
font-size:18px;
font-weight:600;
letter-spacing:2px;
text-transform:uppercase;
margin-bottom:10px;
display:block;
}
.contact-card h2{
font-size:52px;
margin-bottom:20px;
}
.contact-card p{
font-size:19px;
line-height:1.8;
color:#d0d0d0;
max-width:620px;
margin:0 auto 40px;
}
.contact-method{
background:rgba(255,255,255,.02);
border:1px solid rgba(255,255,255,.06);
border-radius:14px;
padding:25px;
margin-bottom:20px;
transition:.3s;
}
.contact-method:hover{
border-color:#00d9ff;
background:rgba(0,217,255,.05);
}
.contact-method h3{
color:#00d9ff;
font-size:24px;
margin-bottom:8px;
}
.contact-method p{
font-size:18px;
color:#c5c5c5;
margin:0;
}
.contact-footer{
color:#888;
font-size:17px;
margin-top:40px;
font-style:italic;
}

/* Responsive */
@media(max-width:900px){
.contact-section{
padding:160px 5% 100px;
}
.contact-card{
padding:40px 25px;
}
.contact-card h2{
font-size:42px;
}
}
</style>
</head>
<body>
<div class="grid"></div>

<nav>
<div class="logo">
Hyper<span>.</span>
</div>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="index.html#about">About</a></li>
<li><a href="projects.html">Projects</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>
</nav>

<section class="contact-section">
<div class="contact-card">
    <span class="small-title">CONTACT</span>
    <h2>Get in Touch</h2>
    <p>
        Have a project, collaboration, question, or just want to say hi? 
        Feel free to reach out using either of the methods below.
    </p>
    
    <div class="contact-method">
        <h3>Discord</h3>
        <p>@hyperisunknown</p>
    </div>
    
    <div class="contact-method">
        <h3>Email</h3>
        <p>frazeroakley@gmail.com</p>
    </div>

    <p class="contact-footer">
        I usually respond as soon as I'm available.
    </p>
</div>
</section>

</body>
</html>
